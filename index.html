        }
      }
      a = b;
    }
  };
  walk(F ? F.children : AROMA_ROOTS, 0, 2 * Math.PI, 0);
  let center;
  if (!F){
    center = '<circle r="'+L.c+'" class="hub"/><text class="hub-t" font-size="11" text-anchor="middle" dominant-baseline="central">'+(aromaLang === "en" ? "Aromas" : "Aromi")+"</text>";
  } else {
    const on = !!st.selected && st.selected.has(F.id), name = (on ? "✓ " : "") + F[aromaLang], fill = inkOn(F.color), maxW = L.c * 1.62;
    let fit = null;
    for (let size = 14; size >= 8.5 && !fit; size -= 0.5){
      const opts = [[name]].concat(splitTwo(name));
      for (const lines of opts) if (Math.max(...lines.map(l => textW(l, size))) <= maxW && lines.length * size * 1.12 <= L.c){ fit = {size, lines}; break; }
    }
    fit = fit || {size: 8.5, lines: [name]};
    const lh = fit.size * 1.12, n = fit.lines.length;
    center = '<g data-role="center" role="button" tabindex="0" aria-label="Torna indietro da '+esc(F[aromaLang])+'">' +
      '<circle r="'+L.c+'" fill="'+F.color+'"/>' +
      '<text font-size="'+fit.size+'" fill="'+fill+'" text-anchor="middle">' +
        fit.lines.map((l, i) => '<tspan x="0" y="'+((i - (n - 1) / 2) * lh - 6).toFixed(2)+'" dominant-baseline="central">'+esc(l)+"</tspan>").join("") + "</text>" +
      '<text font-size="9.5" fill="'+fill+'" opacity=".85" text-anchor="middle" y="'+((n - 1) / 2 * lh + 10).toFixed(2)+'" dominant-baseline="central">‹ '+(aromaLang === "en" ? "back" : "indietro")+"</text></g>";
    if (on) marks += '<circle class="sel-bg" r="'+(L.c - 2.5)+'"/><circle class="sel" r="'+(L.c - 2.5)+'"/>';
  }
  return '<svg class="wheel" viewBox="-200 -200 400 400" role="group" aria-label="Ruota degli aromi">'+segs+center+marks+"</svg>";
}

/* componente: modalità "select" (scegli gli aromi di un'estrazione) o "view" (consultazione) */
function aromaWheel(host, o){
  const st = o.state || {focus: null, info: null};
  st.selected = o.selected || null;
  host.classList.add("wheel-host");
  host.innerHTML = '<div class="wheel-bar"><nav class="crumbs" aria-label="Percorso nella ruota"></nav>'+langSwitch()+'</div><div class="wheel-box"></div>' +
    (o.mode === "select" ? '<div class="wheel-pick"></div>' : "");
  const q = s => host.querySelector(s);
  function crumbs(){
    const path = []; for (let n = st.focus ? AROMA.get(st.focus) : null; n; n = n.parent) path.unshift(n);
    const all = aromaLang === "en" ? "Whole wheel" : "Tutta la ruota";
    return (path.length ? '<button type="button" data-crumb="">'+all+"</button>" : "<b>"+all+"</b>") +
      path.map((n, i) => "<span>›</span>" + (i === path.length - 1 ? "<b>"+esc(n[aromaLang])+"</b>" : '<button type="button" data-crumb="'+esc(n.id)+'">'+esc(n[aromaLang])+"</button>")).join("");
  }
  function pick(){
    const F = st.focus ? AROMA.get(st.focus) : null, sel = sortAromas(st.selected);
    let h = "";
    if (F){
      const on = st.selected.has(F.id);
      h += '<button type="button" class="btn small'+(on ? " primary" : "")+'" data-pickfocus aria-pressed="'+on+'">' +
        (on ? "✓ «"+esc(F[aromaLang])+"» selezionato" : "Seleziona «"+esc(F[aromaLang])+"» in generale") + "</button>";
    } else h += '<p class="hint">Tocca una categoria per aprirla, poi tocca gli aromi che senti. Se non riconosci quello specifico, apri la categoria e selezionala in generale.</p>';
    h += '<div class="field"><span class="flabel">Selezionati' + (sel.length ? " ("+sel.length+")" : "") + "</span>" +
      (sel.length ? '<div class="aromas">'+sel.map(id => aromaChip(id, true)).join("")+"</div>" : '<p class="hint">Nessun aroma selezionato.</p>') + "</div>";
    return h;
  }
  function draw(anim){
    q(".crumbs").innerHTML = crumbs();
    host.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.lang === aromaLang)));
    q(".wheel-box").innerHTML = wheelSvg(st);
    if (anim) q("svg.wheel").classList.add(anim === "in" ? "zin" : "zout");
    if (o.mode === "select") q(".wheel-pick").innerHTML = pick();
  }
  function zoom(id){
    const before = st.focus ? AROMA.get(st.focus).depth : 0, after = id ? AROMA.get(id).depth : 0;
    st.focus = id || null;
    if (o.mode === "view"){ st.info = st.focus; o.onInfo && o.onInfo(st.info); }
    draw(after > before ? "in" : after < before ? "out" : null);
  }
  function toggle(id){
    if (st.selected.has(id)) st.selected.delete(id); else st.selected.add(id);
    draw(); o.onChange && o.onChange();
  }
  function act(el){
    if (el.dataset.role === "center"){ const F = AROMA.get(st.focus); zoom(F && F.parent ? F.parent.id : null); return; }
    const n = AROMA.get(el.dataset.id); if (!n) return;
    if (n.children.length) zoom(n.id);
    else if (o.mode === "select") toggle(n.id);
    else { st.info = st.info === n.id ? st.focus : n.id; draw(); o.onInfo && o.onInfo(st.info); }
  }
  host.addEventListener("click", e => {
    const t = e.target;
    const seg = t.closest("svg.wheel [data-id], svg.wheel [data-role]"); if (seg){ act(seg); return; }
    const cr = t.closest("[data-crumb]"); if (cr){ zoom(cr.dataset.crumb || null); return; }
    const lg = t.closest("[data-lang]"); if (lg){ if (lg.dataset.lang !== aromaLang){ setAromaLang(lg.dataset.lang); draw(); o.onLang && o.onLang(); } return; }
    const rm = t.closest("[data-rm]"); if (rm && st.selected){ toggle(rm.dataset.rm); return; }
    if (t.closest("[data-pickfocus]") && st.focus) toggle(st.focus);
  });
  host.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const seg = e.target.closest && e.target.closest("svg.wheel [data-id], svg.wheel [data-role]");
    if (!seg) return;
    e.preventDefault();
    const keep = seg.dataset.id || "";
    act(seg);
    const again = keep && host.querySelector('svg.wheel [data-id="'+CSS.escape(keep)+'"]');
    (again || host.querySelector("svg.wheel [data-role], svg.wheel [data-id]"))?.focus();
  });
  draw();
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { if (host.isConnected) draw(); });
  return {
    draw,
    show(id){ const n = AROMA.get(id); if (!n) return; st.focus = n.children.length ? n.id : (n.parent ? n.parent.id : null); st.info = id; draw("in"); o.onInfo && o.onInfo(st.info); },
  };
}

/* ---------- estrazione come immagine ---------- */
function loadImg(src){
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image(); im.crossOrigin = "anonymous";
    const t = setTimeout(() => res(null), 6000);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); res(null); };
    /* parametro in più: evita la copia in cache senza permessi, che renderebbe la foto inutilizzabile nell'immagine */
    im.src = src + (src.includes("?") ? "&" : "?") + "share=1";
  });
}
function wrapLines(x, text, maxW, maxLines){
  const out = [];
  for (const para of String(text).split(/\n+/)){
    let line = "";
    for (const w of para.split(/\s+/).filter(Boolean)){
      const t = line ? line + " " + w : w;
      if (x.measureText(t).width <= maxW || !line) line = t; else { out.push(line); line = w; }
    }
    if (line) out.push(line);
  }
  if (out.length > maxLines){
    const cut = out.slice(0, maxLines);
    let last = cut[maxLines - 1];
    while (last && x.measureText(last + "…").width > maxW) last = last.slice(0, -1);
    cut[maxLines - 1] = last.replace(/[\s,.;:]+$/, "") + "…";
    return cut;
  }
  return out;
}
function starPath(x, cx, cy, r){
  x.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  x.closePath();
}
function roundRect(x, X, Y, w, h, r){ x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); }
async function brewImage(b){
  const k = S.catalog.get(brewCatalogId(b)) || {name: "Caffè"};
  const p = b.params || {};
  const W = 1080, H = 1350, M = 72;
  const C = {bg:"#f2f1ec", card:"#ffffff", ink:"#1f1b18", muted:"#6b645c", line:"#e0dcd4", accent:"#a3254a", cream:"#f2e6d0", star:"#b9792c"};
  const DISP = '"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif', BODY = '"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif', MONO = '"IBM Plex Mono", Menlo, monospace';
  try { await Promise.all(['700 60px "Bricolage Grotesque"', '400 30px "IBM Plex Sans"', '500 30px "IBM Plex Sans"', '500 40px "IBM Plex Mono"'].map(f => document.fonts.load(f))); } catch {}
  const photo = k.photo ? await loadImg(photoUrl(k.photo)) : null;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  /* intestazione */
  x.fillStyle = C.accent; x.fillRect(0, 0, W, 110);
  x.fillStyle = C.cream; x.font = "500 30px " + BODY; x.textBaseline = "middle";
  x.fillText("DIARIO CAFFÈ · COMMUNITY", M, 56);
  x.textAlign = "right"; x.fillText(fmtDate(b.at), W - M, 56); x.textAlign = "left";
  /* caffè */
  let y = 160;
  const ph = 300;
  let tx = M;
  if (photo){
    x.save(); roundRect(x, M, y, ph, ph, 28); x.clip();
    x.fillStyle = C.card; x.fillRect(M, y, ph, ph);
    const sc = Math.max(ph / photo.naturalWidth, ph / photo.naturalHeight);
    const w = photo.naturalWidth * sc, h = photo.naturalHeight * sc;
    x.drawImage(photo, M + (ph - w) / 2, y + (ph - h) / 2, w, h);
    x.restore();
    tx = M + ph + 44;
  }
  const tw = W - M - tx;
  x.textBaseline = "alphabetic"; x.fillStyle = C.ink; x.font = "700 62px " + DISP;
  let ty = y + 58;
  for (const l of wrapLines(x, k.name, tw, photo ? 3 : 2)){ x.fillText(l, tx, ty); ty += 68; }
  x.font = "400 36px " + BODY; x.fillStyle = C.muted;
  if (k.roaster){ ty += 4; x.fillText(wrapLines(x, k.roaster, tw, 1)[0], tx, ty); ty += 46; }
  const orig = [k.origin, k.process].filter(Boolean).join(" · ");
  if (orig){ x.font = "400 30px " + BODY; x.fillText(wrapLines(x, orig, tw, 1)[0], tx, ty); ty += 40; }
  y = Math.max(y + (photo ? ph : 0), ty) + 50;
  /* metodo e voto */
  x.fillStyle = C.ink; x.font = "700 46px " + DISP;
  const stW = b.rating ? 5 * 46 : 0;
  x.fillText(wrapLines(x, brewTitle(b), W - 2 * M - stW - 20, 1)[0], M, y);
  if (b.rating){
    for (let i = 0; i < 5; i++){ starPath(x, W - M - stW + 23 + i * 46, y - 16, 20); x.fillStyle = i < b.rating ? C.star : C.line; x.fill(); }
  }
  const age = brewAge(b);
  y += 46; x.font = "400 30px " + BODY; x.fillStyle = C.muted;
  x.fillText(fmtWhen(b.at) + (age != null ? " · " + age + " gg dalla tostatura" : ""), M, y);
  /* parametri */
  y += 40;
  const items = brewParams(b).map(([lbl, key, v]) => {
    if (key === "ratio") return [lbl, v, ""];
    if (key === "grind") return [lbl, fmtNum(v), grinderName(p)];
    return [lbl, paramRaw(key, v, p), ""];
  });
  const cols = 3, cw = (W - 2 * M) / cols, rowH = 118, rows = Math.ceil(items.length / cols);
  if (items.length){
    x.fillStyle = C.card; roundRect(x, M - 8, y, W - 2 * M + 16, rows * rowH + 24, 28); x.fill();
    x.strokeStyle = C.line; x.lineWidth = 2; x.stroke();
    items.forEach(([lbl, val, sub], i) => {
      const cx = M + 24 + (i % cols) * cw, cy = y + 50 + Math.floor(i / cols) * rowH;
      x.fillStyle = C.muted; x.font = "500 24px " + BODY; x.fillText(lbl.toUpperCase(), cx, cy);
      x.fillStyle = C.ink; let fs = 42; x.font = "500 " + fs + "px " + MONO;
      while (fs > 24 && x.measureText(val).width > cw - 34){ fs -= 2; x.font = "500 " + fs + "px " + MONO; }
      x.fillText(val, cx, cy + 50);
      if (sub){ x.fillStyle = C.muted; x.font = "400 22px " + BODY; x.fillText(wrapLines(x, sub, cw - 34, 1)[0], cx, cy + 82); }
    });
    y += rows * rowH + 24;
  }
  const footY = H - 70;
  /* aromi percepiti: etichette colorate, al massimo nello spazio che resta sopra il piede */
  const ar = sortAromas(b.aromas);
  if (ar.length){
    let ax = M, ay = y + 56;
    x.font = "500 30px " + BODY; x.textBaseline = "middle";
    x.fillStyle = C.muted; x.font = "500 24px " + BODY; x.fillText("AROMI", M, ay); ay += 50; x.font = "500 30px " + BODY;
    for (const id of ar){
      const n = AROMA.get(id), label = n[aromaLang], w = x.measureText(label).width + 76;
      if (ax + w > W - M){ ax = M; ay += 66; }
      if (ay > footY - 70) break;
      x.fillStyle = C.card; roundRect(x, ax, ay - 26, w, 52, 26); x.fill(); x.strokeStyle = C.line; x.lineWidth = 2; x.stroke();
      x.beginPath(); x.arc(ax + 30, ay, 10, 0, 2 * Math.PI); x.fillStyle = n.color; x.fill(); x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = 1.5; x.stroke();
      x.fillStyle = C.ink; x.fillText(label, ax + 50, ay + 1);
      ax += w + 12;
    }
    x.textBaseline = "alphabetic";
  }
  /* piede */
  x.fillStyle = C.muted; x.font = "500 28px " + BODY;
  x.fillText("di " + (nick(isMineBrew(b) ? me() : b.owner) || "un membro della community"), M, footY);
  if (k.tasting){ x.textAlign = "right"; x.font = "400 24px " + BODY; x.fillText(wrapLines(x, "In busta: " + k.tasting, W / 2, 1)[0], W - M, footY); x.textAlign = "left"; }
  return new Promise((res, rej) => cv.toBlob(bl => bl ? res(bl) : rej(new Error("toBlob")), "image/png"));
}

function wrapErr(error){
  const m = String((error && error.message) || "");
  const st = error && (error.status || error.statusCode);
  if (error && error.code === "23503") return {code:"in_use", message:m};
  if (!navigator.onLine || /fetch|network|load failed/i.test(m)) return {code:"unavailable", message:m};
  if (st == 401 || st == 403 || (error && error.code === "42501")) return {code:"invalid_argument", message:m};
  if (st == 413) return {code:"too_large", message:m};
  return {code:"error", message:m};
}

const sortBrews = () => { S.brews.sort(byAt); S.feed.sort(byAt); };

    S.catalog = new Map(c.catalog.map(x => [x.id, x])); S.bags = new Map(c.bags.map(x => [x.id, x]));
    S.brews = c.brews; sortBrews(); S.grinders = new Map(c.grinders.map(x => [x.id, x]));
    S.profiles = new Map(c.profiles || []); S.counts = new Map(c.counts || []); S.isAdmin = !!c.isAdmin;
    S.machines = new Map((c.machines || []).map(x => [x.id, x])); S.feed = c.feed || []; S.pairs = c.pairs || []; S.presets = c.presets || []; sortBrews();
    S.loaded = true; return true;
  } catch { return false; }
}
/* extra: per il catalogo chi l'ha creato, per le estrazioni il proprietario */
function applyRow(table, id, data, createdBy){
  if (table === "catalog"){ if (data) S.catalog.set(id, {id, createdBy: createdBy !== undefined ? createdBy : S.catalog.get(id)?.createdBy, ...data}); else S.catalog.delete(id); }
  else if (table === "coffees"){ if (data) S.bags.set(id, {id, ...data}); else S.bags.delete(id); }
  else if (table === "grinders"){ if (data) S.grinders.set(id, {id, ...data}); else S.grinders.delete(id); }
  else if (table === "machines"){ if (data) S.machines.set(id, {id, ...data}); else S.machines.delete(id); }
  else {
    const owner = createdBy;
    S.brews = S.brews.filter(b => b.id !== id); S.feed = S.feed.filter(b => b.id !== id);
    if (data){
      if (!owner || owner === me()) S.brews.push({id, ...data});
      else if (data.public) S.feed.push({id, owner, ...data});
    }
    sortBrews();
  }
  saveCache(); render();
}
function localOf(table, id){
  if (table === "catalog") return S.catalog.get(id);
  if (table === "coffees") return S.bags.get(id);
  if (table === "grinders") return S.grinders.get(id);
  if (table === "machines") return S.machines.get(id);
  return S.brews.find(b => b.id === id);
}
function makeDb(){
  return { collection(table){ return { doc(id){ return {
    async set(data){
      const row = {...TABLES[table].row(id, data), updated_at: new Date().toISOString()};
      const {error} = await sb.from(table).upsert(row);
      if (error) throw wrapErr(error);
      applyRow(table, id, data, table === "catalog" ? (S.catalog.get(id)?.createdBy || me()) : table === "brews" ? me() : undefined);
    },
    async update(part){
      const cur = localOf(table, id);
      if (!cur) throw {code:"invalid_argument"};
      const {id: _i, createdBy: _c, ...rest} = cur;
      await this.set({...rest, ...part});
    },
    async delete(){
      const {error} = await sb.from(table).delete().eq("id", id);
      if (error) throw wrapErr(error);
      applyRow(table, id, null);
    },
  }; } }; } };
}
function makeAssets(){
  return {
    async upload(blob, opts){
      const type = (opts && opts.type) || blob.type || "image/jpeg";
      const ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : type === "image/gif" ? "gif" : "jpg";
      const path = me() + "/" + uid("p") + "." + ext;
      const {error} = await sb.storage.from("photos").upload(path, blob, {contentType: type, cacheControl: "31536000", upsert: false});
      if (error) throw wrapErr(error);
      return {id: path};
    },
    async delete(path){ if (path && path.includes("/") && (path.startsWith(me() + "/") || S.isAdmin)) await sb.storage.from("photos").remove([path]); },
  };
}
async function fetchAll(table, cols){
  const out = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await sb.from(table).select(cols).range(from, from + 999);
    if (error) throw wrapErr(error);
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function loadPresets(){
  try {

    if (!error && Array.isArray(data)){ S.presets = data.map(r => ({brand: r.brand || "", model: r.model, burrs: r.burrs || "Standard", min: Number(r.min), max: Number(r.max), step: Number(r.step), members: Number(r.members)})); saveCache(); }
  } catch {}

function grinderPresets(){
  const best = new Map();
  for (const t of [...S.presets, ...GRINDER_TEMPLATES.map(t => ({...t, members: 0}))]){
    const key = norm(t.brand) + "|" + norm(t.model) + "|" + norm(t.burrs || "Standard");
    const cur = best.get(key);
    if (!cur || (t.members || 0) > (cur.members || 0)) best.set(key, t);
  }
  return [...best.values()].sort((a, b) => (b.members || 0) - (a.members || 0) || grinderLabel(a).localeCompare(grinderLabel(b), "it"));
}

  if (refreshing) return; refreshing = true;
  try {
    const [k, c, b, g, p, a, m, pr] = await Promise.all([

      fetchAll("grinders", "id,data"), fetchAll("profiles", "id,name"),
      fetchAll("admins", "user_id").catch(() => []), fetchAll("machines", "id,data").catch(() => []),
      fetchAll("catalog_pairs", "a,b,status,reported_by").catch(() => []),
    ]);
    S.catalog = new Map(k.map(r => [r.id, {id: r.id, createdBy: r.created_by, ...(r.data || {})}]));
    S.bags = new Map(c.map(r => [r.id, {id: r.id, ...(r.data || {})}]));

    sortBrews();

let channel = null;
function subscribe(){
  if (channel) return;
  const onChange = table => p => {
    if (p.eventType === "DELETE"){ if (p.old && p.old.id) applyRow(table, p.old.id, null); }
    else if (p.new && p.new.id) applyRow(table, p.new.id, p.new.data, table === "catalog" ? p.new.created_by : table === "brews" ? p.new.owner : undefined);
  };
  channel = sb.channel("community");
  for (const t of Object.keys(TABLES)) channel.on("postgres_changes", {event:"*", schema:"public", table:t}, onChange(t));
  channel.on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, p => {
    if (p.new && p.new.id){ S.profiles.set(p.new.id, p.new.name || ""); saveCache(); render(); }
  });
  channel.subscribe();
}

  db = makeDb(); assets = makeAssets();
  loadCache(); render();
  setTimeout(() => { if (!S.loaded){ S.slow = true; render(); } }, 6000);
  await refresh();
  subscribe();
}

/* ---------- importazione da Beanconqueror ----------
   Esportazione: Beanconqueror.zip con Beanconqueror.json (+ Beanconqueror_Brews_1.json… oltre 500 elementi).
   Le foto non sono incluse (Beanconqueror salva solo il percorso sul telefono). */
/* zip minimale: file "stored" o "deflate" (DecompressionStream del browser) */
async function readZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("zip");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = new Map(), dec = new TextDecoder();
  for (let n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("zip");
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    files.set(name, async () => {
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      const raw = u8.slice(start, start + size);
      if (method === 0) return dec.decode(raw);
      if (method !== 8 || typeof DecompressionStream === "undefined") throw new Error("zip-method");
      return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    });
    p += 46 + nameLen + extraLen + commLen;
  }
  return files;
}
async function readBeanconqueror(file){
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (head[0] === 0x50 && head[1] === 0x4b){
    const files = await readZip(await file.arrayBuffer());
    const main = files.get("Beanconqueror.json"); if (!main) return null;
    const data = JSON.parse(await main());
    for (const [prop, part] of [["BREWS", "Brews"], ["BEANS", "Beans"]]){
      for (let i = 1; files.has("Beanconqueror_" + part + "_" + i + ".json"); i++){
        const chunk = JSON.parse(await files.get("Beanconqueror_" + part + "_" + i + ".json")());
        if (Array.isArray(chunk)) data[prop] = (data[prop] || []).concat(chunk);
      }
    }
    return data;
  }
  return null;
}

/* metodo di preparazione Beanconqueror → metodo del diario */
const BC_TYPES = {
  V60:"filtro", ORIGAMI:"filtro", KALITA_WAVE:"filtro", OREA:"filtro", CHEMEX:"filtro", DRIPPER:"filtro", BLUE_DRIPPER:"filtro", KONO:"filtro",
  APRIL_BREWER:"filtro", CAFEC_FLOWER:"filtro", HSIAO_50:"filtro", ESPRO_BLOOM:"filtro", GINA:"filtro", MOCCA_MASTER:"filtro", FELLOW_STAGG:"filtro",
  AEROPRESS:"aeropress", AEROPRESS_INVERTED:"aeropress", DELTER_PRESS:"aeropress",
  BIALETTI:"moka", FRENCH_PRESS:"frenchpress",
  PORTAFILTER:"espressoClassico", METICULOUS:"espressoClassico", SANREMO_YOU:"espressoClassico", XENIA:"espressoClassico", GAGGIMATE:"espressoClassico",
  GAGGIUINO:"espressoClassico", HAND_LEVER:"espressoClassico", FLAIR:"espressoClassico", CAFELAT:"espressoClassico",
};
const BC_DRIPPERS = {V60:"V60", ORIGAMI:"Origami", KALITA_WAVE:"Kalita", OREA:"Orea"};
const bcMethodGuess = p => BC_TYPES[p.type] || (p.style_type === "ESPRESSO" ? "espressoClassico" : p.style_type === "POUR OVER" ? "filtro" : "");
const bcId = x => x && x.config && x.config.uuid ? String(x.config.uuid) : "";
const bcNum = v => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) && n > 0 ? n : null; };
const bcDate = x => { const t = x && x.config && x.config.unix_timestamp; return t ? new Date(t * 1000) : null; };
function bcLocalDay(iso){ const d = new Date(iso); if (isNaN(d)) return ""; const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
const fmtSec = s => s >= 60 ? Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0") + " min" : fmtNum(Math.round(s * 10) / 10) + " s";
function bcFlavors(f){
  const ids = !f || !f.predefined_flavors ? [] : Array.isArray(f.predefined_flavors) ? f.predefined_flavors : Object.keys(f.predefined_flavors).filter(k => f.predefined_flavors[k]);
  const aromas = new Set(), words = [];
  for (const id of ids){
    const e = BC_FLAVORS[id]; if (!e) continue;
    if (e[1] && AROMA.has(e[1])) aromas.add(e[1]);
    if (!e[2]) words.push(e[0]);
  }
  for (const c of (f && f.custom_flavors) || []) if (c && String(c).trim()) words.push(String(c).trim());
  return {aromas: sortAromas(aromas), words};
}

function beanconquerorSheet(data){
  const beans = data.BEANS.filter(b => bcId(b) && b.name);
  const beanIds = new Set(beans.map(bcId));
  const brews = data.BREWS.filter(b => bcId(b) && beanIds.has(String(b.bean)));
  const mills = new Map((data.MILL || []).filter(bcId).map(m => [bcId(m), m]));
  const preps = new Map((data.PREPARATION || []).filter(bcId).map(p => [bcId(p), p]));
  const usedMills = [...new Set(brews.filter(b => bcNum(b.grind_size) != null && mills.has(String(b.mill))).map(b => String(b.mill)))].map(id => mills.get(id));
  const usedPreps = [...new Set(brews.map(b => String(b.method_of_preparation)).filter(id => preps.has(id)))].map(id => preps.get(id));
  const settings = (data.SETTINGS || [])[0] || {};
  const maxRating = bcNum(settings.brew_rating) || 5;
  const done = brews.filter(b => S.brews.some(x => x.id === "bc-" + bcId(b))).length;
  const flavorCount = brews.filter(b => bcFlavors(b.cupped_flavor).aromas.length).length;
  if (!beans.length){ toast("Nel file di Beanconqueror non ci sono caffè da importare."); return; }

  /* abbinamenti proposti */
  const presetsAll = grinderPresets();
  const millChoice = new Map();
  for (const m of usedMills){
    const own = [...S.grinders.values()].map(g => ["g:" + g.id, nameScore(m.name, [g.brand, g.model, g.burrs].join(" "))]);
    const pre = presetsAll.map((t, i) => ["p:" + i, nameScore(m.name, [t.brand, t.model, t.burrs === "Standard" ? "" : t.burrs].join(" "))]);
    const best = [...own, ...pre].filter(x => x[1] >= 0.5).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))[0];
    millChoice.set(bcId(m), best ? best[0] : "");
  }
  const beanChoice = new Map();
  for (const b of beans){
    const sim = likelyDuplicates({name: b.name, roaster: b.roaster || ""});
    beanChoice.set(bcId(b), sim[0] ? "k:" + sim[0].id : "new");
  }
  const prepChoice = new Map(usedPreps.map(p => [bcId(p), bcMethodGuess(p) || "keep"]));

  const millOptions = sel => '<option value="">Nessuno: la macinatura va nelle note</option>' +
    (S.grinders.size ? '<optgroup label="I tuoi macinini">' + [...S.grinders.values()].map(g => '<option value="g:'+esc(g.id)+'"'+(sel === "g:" + g.id ? " selected" : "")+'>'+esc(grinderLabel(g))+"</option>").join("") + "</optgroup>" : "") +
    '<optgroup label="Crea dai modelli">' + presetsAll.map((t, i) => '<option value="p:'+i+'"'+(sel === "p:" + i ? " selected" : "")+'>'+esc(grinderLabel(t) + " · " + fmtNum(t.min) + "–" + fmtNum(t.max) + ", step " + fmtNum(t.step))+"</option>").join("") + "</optgroup>";
  const draw = () => {
    let h = '<p style="margin:0">Trovati <b>' + beans.length + (beans.length === 1 ? " caffè" : " caffè") + "</b> e <b>" + brews.length + (brews.length === 1 ? " estrazione" : " estrazioni") + "</b>" +
      (done ? " (" + done + " già importate: non vengono toccate)" : "") + ".</p>" +
      '<p class="hint">Le foto non sono incluse nell\'esportazione di Beanconqueror: puoi aggiungerle dopo dalla scheda del caffè.</p>';
    h += '<div class="field"><span class="flabel">Caffè</span>' + beans.map(b => {
      const id = bcId(b), sim = likelyDuplicates({name: b.name, roaster: b.roaster || ""}).slice(0, 3), had = S.bags.has("bc-" + id);
      return '<div class="bc-row"><b>'+esc(b.name)+"</b>" + (b.roaster ? '<span class="small muted">'+esc(b.roaster)+"</span>" : "") +
        (had ? '<span class="hint">Già importato.</span>' :
        '<select data-bean="'+esc(id)+'" aria-label="Scheda per '+esc(b.name)+'"><option value="new">Crea una nuova scheda nel catalogo</option>' +
        sim.map(k => '<option value="k:'+esc(k.id)+'"'+(beanChoice.get(id) === "k:" + k.id ? " selected" : "")+'>Usa la scheda «'+esc(k.name + (k.roaster ? " · " + k.roaster : ""))+"»</option>").join("") + "</select>") + "</div>";
    }).join("") + "</div>";
    if (usedPreps.length) h += '<div class="field"><span class="flabel">Metodi</span>' + usedPreps.map(p => {
      const id = bcId(p), sel = prepChoice.get(id);
      return '<div class="bc-row"><b>'+esc(p.name || p.type)+'</b><select data-prep="'+esc(id)+'" aria-label="Metodo per '+esc(p.name || p.type)+'">' +
        Object.keys(METHODS).map(k => '<option value="'+k+'"'+(sel === k ? " selected" : "")+">"+esc(METHODS[k].label)+"</option>").join("") +
        '<option value="keep"'+(sel === "keep" ? " selected" : "")+'>Tienilo come «'+esc(p.name || p.type)+'» (metodo a sé)</option></select></div>';
    }).join("") + "</div>";
    if (usedMills.length) h += '<div class="field"><span class="flabel">Macinini</span>' + usedMills.map(m => {
      const id = bcId(m);
      return '<div class="bc-row"><b>'+esc(m.name)+'</b><select data-mill="'+esc(id)+'" aria-label="Macinino per '+esc(m.name)+'">'+millOptions(millChoice.get(id))+'</select>' +
        '<button type="button" class="btn small" data-newmill="'+esc(id)+'" style="align-self:flex-start">+ Nuovo macinino</button></div>';
    }).join("") + '<p class="hint">Beanconqueror non salva la scala del macinino: scegli il tuo o un modello, così la macinatura resta confrontabile.</p></div>';
    if (flavorCount) h += '<p class="hint">Gli aromi scelti in Beanconqueror passano sulla ruota SCA; quelli senza un equivalente preciso vanno anche nelle note.</p>';
    h += '<p class="hint">Le nuove schede del catalogo le vedono tutti i membri; confezioni ed estrazioni restano private.</p>';
    s.el.querySelector("#bc-body").innerHTML = h;
  };
  const s = openSheet("Importa da Beanconqueror", '<div id="bc-body" class="bc-body"></div><div class="form-foot"><button type="button" class="btn" data-close>Annulla</button><button type="button" class="btn primary" id="bc-go">Importa</button></div>', "bc-sheet");
  draw();
  s.el.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.bean) beanChoice.set(t.dataset.bean, t.value);
    if (t.dataset.prep) prepChoice.set(t.dataset.prep, t.value);
    if (t.dataset.mill != null && t.dataset.mill !== "") millChoice.set(t.dataset.mill, t.value);
  });
  s.el.addEventListener("click", e => {
    const nb = e.target.closest("[data-newmill]"); if (!nb) return;
    grinderSheet(null, g => { if (g){ millChoice.set(nb.dataset.newmill, "g:" + g.id); draw(); } });
  });
  s.el.querySelector("#bc-go").addEventListener("click", async () => {
    const btn = s.el.querySelector("#bc-go");
    await withBusy(btn, "Importo…", async () => {
      try {
        const now = new Date().toISOString();
        const grinderRows = [], catalogRows = [], bagRows = [], brewRows = [];
        /* macinini: i propri o nuovi dai modelli (uno solo per modello) */
        const fromPreset = new Map(), millGrinder = new Map();
        for (const m of usedMills){
          const c = millChoice.get(bcId(m)) || "";
          if (c.startsWith("g:") && S.grinders.has(c.slice(2))) millGrinder.set(bcId(m), S.grinders.get(c.slice(2)));
          else if (c.startsWith("p:")){
            if (!fromPreset.has(c)){
              const t = presetsAll[Number(c.slice(2))], id = uid("g");
              const g = {id, brand: t.brand || "", model: t.model, burrs: t.burrs || "Standard", min: t.min, max: t.max, step: t.step, createdAt: now};
              const {id: _x, ...rest} = g; grinderRows.push({id, data: rest, updated_at: now}); fromPreset.set(c, g);
            }
            millGrinder.set(bcId(m), fromPreset.get(c));
          }
        }
        /* caffè: scheda (nuova o esistente) + confezione */
        const bagOf = new Map(), bagData = new Map();
        for (const b of beans){
          const id = bcId(b), bagId = "bc-" + id;
          if (S.bags.has(bagId)){ bagOf.set(id, bagId); bagData.set(bagId, S.bags.get(bagId)); continue; }
          const c = beanChoice.get(id) || "new";
          let kid = c.startsWith("k:") && S.catalog.has(c.slice(2)) ? c.slice(2) : null;
          if (!kid){
            kid = "kbc-" + id;
            const info = (b.bean_information || []).filter(x => x && typeof x === "object");
            const join = (key, sep) => [...new Set(info.map(x => String(x[key] || "").trim()).filter(Boolean))].join(sep);
            const origin = [...new Set(info.map(x => [x.country, x.region].map(v => String(v || "").trim()).filter(Boolean).join(", ")).filter(Boolean))].join(" / ");
            const profile = {FILTER:"Filtro", ESPRESSO:"Espresso", OMNI:"Omni"}[b.bean_roasting_type] || "";
            const k = {name: String(b.name).trim(), roaster: String(b.roaster || "").trim(), origin, variety: join("variety", " / "), process: join("processing", " / "), profile, tasting: String(b.aromatics || "").trim(), photo: null, createdAt: now};
            if (!S.catalog.has(kid)) catalogRows.push({id: kid, data: k, updated_at: now});
          }
          const created = b.buyDate ? new Date(b.buyDate) : bcDate(b);
          const bag = {catalogId: kid, roastDate: b.roastingDate ? bcLocalDay(b.roastingDate) : "", weight: bcNum(b.weight), price: bcNum(b.cost),
            finished: !!b.finished, finishedAt: b.finished ? now : null, createdAt: created && !isNaN(created) ? created.toISOString() : now};
          bagRows.push({id: bagId, catalog_id: kid, data: bag, updated_at: now});
          bagOf.set(id, bagId); bagData.set(bagId, bag);
        }
        /* estrazioni */
        let skipped = 0;
        for (const b of brews){
          const id = "bc-" + bcId(b);
          if (S.brews.some(x => x.id === id)){ skipped++; continue; }
          const bagId = bagOf.get(String(b.bean)), bag = bagData.get(bagId); if (!bag) continue;
          const prep = preps.get(String(b.method_of_preparation));
          const choice = prep ? (prepChoice.get(bcId(prep)) || "keep") : "keep";
          const method = choice === "keep" ? String(prep ? (prep.name || prep.type) : "Beanconqueror") : choice;
          const fields = METHODS[method] ? METHODS[method].fields : null;
          const espresso = /^espresso/.test(method);
          const p = {}, extra = [];
          const put = (k, v, label) => { if (v == null) return; if (!fields || fields.includes(k)) p[k] = v; else extra.push(label); };
          const dose = bcNum(b.grind_weight), water = bcNum(b.brew_quantity), out = bcNum(b.brew_beverage_quantity);
          const temp = bcNum(b.brew_temperature), time = bcNum((b.brew_time || 0) + (b.brew_time_milliseconds || 0) / 1000), bloom = bcNum(b.coffee_blooming_time);
          put("dose", dose, "Dose: " + fmtNum(dose) + " g");
          if (espresso){ put("yield", out || water, "Resa: " + fmtNum(out || water) + " g"); }
          else {
            put("water", water, "Acqua: " + fmtNum(water) + " g");
            if (out) extra.push("Bevanda: " + fmtNum(out) + " g");
          }
          put("temp", temp, "Temperatura: " + fmtNum(temp) + " °C");
          put(method === "frenchpress" ? "steep" : "time", time, "Tempo: " + fmtSec(time));
          put("bloomTime", bloom, "Bloom: " + fmtSec(bloom));
          if (method === "filtro" && prep && BC_DRIPPERS[prep.type]) p.dripper = BC_DRIPPERS[prep.type];
          else if (prep && prep.name && METHODS[method] && norm(prep.name) !== norm(METHODS[method].label)) p.device = prep.name;
          const grind = bcNum(b.grind_size), mill = mills.get(String(b.mill)), g = millGrinder.get(String(b.mill));
          if (grind != null && g){ p.grind = grind; p.grinder = g.id; p.grinderLabel = grinderLabel(g); }
          else if (String(b.grind_size || "").trim()) extra.push("Macinatura: " + String(b.grind_size).trim() + (mill && mill.name ? " (" + mill.name + ")" : ""));
          if (bcNum(b.tds)) extra.push("TDS: " + fmtNum(bcNum(b.tds)) + " %");
          if (bcNum(b.coffee_first_drip_time)) extra.push("Prima goccia: " + fmtSec(bcNum(b.coffee_first_drip_time)));
          if (String(b.pressure_profile || "").trim()) extra.push("Profilo di pressione: " + String(b.pressure_profile).trim());
          const fl = bcFlavors(b.cupped_flavor);
          if (fl.words.length) extra.push("Aromi (Beanconqueror): " + fl.words.join(", "));
          const at = bcDate(b) || new Date();
          const r = bcNum(b.rating);
          const age = bag.roastDate ? daysBetween(bag.roastDate, at.toISOString()) : null;
          const data = {
            coffeeId: bagId, method, at: at.toISOString(), params: p,
            rating: r ? Math.min(5, Math.max(1, Math.round(r / maxRating * 5))) : 0,
            notes: [String(b.note || "").trim(), ...extra].filter(Boolean).join("\n"),
            ...(fl.aromas.length ? {aromas: fl.aromas} : {}),
            createdAt: at.toISOString(), catalogId: bag.catalogId, public: false,
            roastDays: age != null && age >= 0 ? age : null,
          };
          brewRows.push({id, coffee_id: bagId, is_public: false, data, updated_at: now});
        }
        const putRows = async (table, rows) => { for (let i = 0; i < rows.length; i += 200){ const {error} = await sb.from(table).upsert(rows.slice(i, i + 200)); if (error) throw wrapErr(error); } };
        await putRows("grinders", grinderRows);
        await putRows("catalog", catalogRows);
        await putRows("coffees", bagRows);
        await putRows("brews", brewRows);
        await refresh(); loadPresets();
        s.close();
        toast("Importati da Beanconqueror: " + bagRows.length + " caffè (" + catalogRows.length + (catalogRows.length === 1 ? " nuova scheda" : " nuove schede") + ") e " + brewRows.length + (brewRows.length === 1 ? " estrazione" : " estrazioni") + (skipped ? " · " + skipped + " già presenti" : ""));
      } catch(e){ toast(errMsg(e)); }
    });
  });
}

function importBackup(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,.zip,application/json,application/zip";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try { data = await readBeanconqueror(f); }
    catch(e){ toast(String(e && e.message) === "zip-method" ? "Questo browser non riesce ad aprire il file .zip: aggiorna il browser o estrai Beanconqueror.json e importa quello." : "Non riesco ad aprire il file .zip."); return; }
    if (!data){
      try { data = JSON.parse(await f.text()); } catch { toast("Il file non è un backup valido."); return; }
    }
    if (isBeanconqueror(data)){ beanconquerorSheet(data); return; }
    const community = data && data.app === "diario-caffe-community", legacy = data && data.app === "diario-caffe";
    if ((!community && !legacy) || !Array.isArray(data.coffees) || !Array.isArray(data.brews)){ toast("Il file non è un backup del Diario caffè."); return; }
    const msg = legacy
      ? "Importare " + data.coffees.length + " caffè e " + data.brews.length + " estrazioni dalla versione personale? I caffè che non sono già nel catalogo diventano nuove schede visibili ai membri; date, pesi, prezzi ed estrazioni restano privati."
      : "Importare " + data.coffees.length + " confezioni e " + data.brews.length + " estrazioni? Se un elemento è già presente viene sostituito dalla versione del file.";
    if (!(await confirmBox(msg, "Importa"))) return;
    toast("Importazione in corso…");
    try {
      const now = new Date().toISOString();
      const grinderRows = [], catalogRows = [], bagRows = [];
      const newCatalog = new Set();
      const machineRows = [];
      if (community && Array.isArray(data.machines)){
        for (const m of data.machines){ if (!m || !m.id) continue; const {id, ...rest} = m; machineRows.push({id: String(id), data: rest, updated_at: now}); }
      }
      if (community && Array.isArray(data.grinders)){
        for (const g of data.grinders){ if (!g || !g.id) continue; const {id, ...rest} = g; grinderRows.push({id: String(id), data: rest, updated_at: now}); }
      }
      if (community){
        for (const k of data.catalog || []){
          if (!k || !k.id || S.catalog.has(k.id)) continue;
          const {id, photoData, createdBy, ...rest} = k;
          const photo = photoData ? await photoFromData(photoData) : (rest.photo || null);
          catalogRows.push({id: String(id), data: {...pick(rest, CATALOG_FIELDS), photo, createdAt: rest.createdAt || now}, updated_at: now});
          newCatalog.add(String(id));
        }
        for (const c of data.coffees){
          if (!c || !c.id || !c.catalogId || !(S.catalog.has(c.catalogId) || newCatalog.has(c.catalogId))) continue;
          const {id, ...rest} = c;
          bagRows.push({id: String(id), catalog_id: rest.catalogId, data: rest, updated_at: now});
        }
      } else {
        const byKey = new Map([...S.catalog.values()].map(k => [norm(k.name) + "|" + norm(k.roaster), k.id]));
        for (const c of data.coffees){
          if (!c || !c.id || !c.name) continue;
          const key = norm(c.name) + "|" + norm(c.roaster);
          let kid = byKey.get(key);
          if (!kid){
            kid = "k" + c.id;
            if (!S.catalog.has(kid)){
              const photo = await photoFromData(c.photoData);
              catalogRows.push({id: kid, data: {...pick(c, CATALOG_FIELDS), photo, createdAt: c.createdAt || now}, updated_at: now});
            }
            byKey.set(key, kid);
          }
          bagRows.push({id: String(c.id), catalog_id: kid, data: {catalogId: kid, ...pick(c, BAG_FIELDS), createdAt: c.createdAt || now}, updated_at: now});
        }
      }
      /* estrazioni: nella versione personale i macinini erano "pietro" e "g5" */
      const legacyGrinder = new Map();
      const ensureGrinder = key => {
        if (legacyGrinder.has(key)) return legacyGrinder.get(key);
        const t = GRINDER_TEMPLATES.find(x => x.key === key); if (!t) return null;
        const found = [...S.grinders.values()].find(g => norm(g.model) === norm(t.model));
        let g = found;
        if (!g){ const id = uid("g"); g = {id, brand:t.brand, model:t.model, burrs:t.burrs, min:t.min, max:t.max, step:t.step, createdAt: now}; const {id: _x, ...rest} = g; grinderRows.push({id, data: rest, updated_at: now}); }
        legacyGrinder.set(key, g); return g;
      };
      const okBags = new Set([...bagRows.map(r => r.id), ...S.bags.keys()]);
      const brewRows = [];
      for (const b of data.brews){
        if (!b || !b.id || !okBags.has(String(b.coffeeId))) continue;
        const {id, ...rest} = b;
        if (legacy && rest.params && rest.params.grind != null){
          const g = ensureGrinder(rest.params.grinder || "pietro");
          rest.params = {...rest.params};
          if (g){ rest.params.grinder = g.id; rest.params.grinderLabel = grinderLabel(g); }
        }
        brewRows.push({id: String(id), coffee_id: String(rest.coffeeId), is_public: !!rest.public, data: rest, updated_at: now});
      }
      const put = async (table, rows) => { for (let i = 0; i < rows.length; i += 200){ const {error} = await sb.from(table).upsert(rows.slice(i, i + 200)); if (error) throw wrapErr(error); } };
      await put("grinders", grinderRows);
      if (machineRows.length) await put("machines", machineRows);
      await put("catalog", catalogRows);
      await put("coffees", bagRows);
      await put("brews", brewRows);
      if (community && data.methodDefaults && !meta().methodDefaults) await setMeta({methodDefaults: data.methodDefaults}).catch(() => {});
      await refresh();
      toast("Importati " + bagRows.length + " caffè (" + catalogRows.length + " nuove schede) e " + brewRows.length + " estrazioni");
    } catch(e){ toast(errMsg(e)); }
  });
  inp.click();
}

if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && db) refresh(); });
window.addEventListener("online", () => { if (db) refresh(); });
window.addEventListener("offline", () => { if (db){ S.offline = true; render(); } });
/* link ricevuti per email: invito o reimpostazione della password */
const linkParams = new URLSearchParams(location.hash.slice(1));
const linkType = linkParams.get("type"), linkError = linkParams.get("error_description") || linkParams.get("error");
render();
(async () => {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase){
    S.error = "Configurazione mancante: inserisci l'indirizzo e la chiave di Supabase nel file config.js.";
    render(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  const {data} = await sb.auth.getSession();
  session = data && data.session;
  sb.auth.onAuthStateChange((evt, s) => { if (s) session = s; if (evt === "PASSWORD_RECOVERY"){ S.needPassword = true; render(); } });
  if (linkType || linkError) history.replaceState(null, "", location.pathname + location.search);
  if (!session){
    S.needLogin = true;
    if (linkError) S.loginMsg = "Il link non è più valido. Chiedi un nuovo invito, oppure usa “Password dimenticata?”.";
    render(); return;
  }
  if (linkType === "invite" || linkType === "recovery"){ S.needPassword = true; render(); return; }
  startData();
})();
})();
