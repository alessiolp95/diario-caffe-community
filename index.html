<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caffè Community">
<meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Diario caffè · Community</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one narrow mobile column; library → coffee detail → bottom-sheet forms. */
:root{
  --bg:#f2f1ec;
  --surface:#ffffff;
  --ink:#1f1b18;
  --muted:#6b645c;
  --line:#e0dcd4;
  --accent:#a3254a;
  --accent-ink:#ffffff;
  --crema:#b9792c;
  --danger:#a23a2a;
  --font-display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body:"IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13110f; --surface:#1d1a17; --ink:#ede8e2; --muted:#a39a90; --line:#2f2a25;
    --accent:#e88aa6; --accent-ink:#2a0a14; --crema:#dba45e; --danger:#e07a68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13110f; --surface:#1d1a17; --ink:#ede8e2; --muted:#a39a90; --line:#2f2a25;
  --accent:#e88aa6; --accent-ink:#2a0a14; --crema:#dba45e; --danger:#e07a68;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{-webkit-text-size-adjust:100%}
img,input,select,textarea,button{max-width:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:20px;overflow-x:hidden}
.wrap > *, .sheet > *, form > *{min-width:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:600}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent;padding-left:0}
.btn.ghost{background:transparent;border-color:transparent;padding-left:0}
.btn:disabled{opacity:.5;cursor:default}

/* library cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--bg);display:block}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.card .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:14px}
.card .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.card.done{opacity:.7}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.fresh{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
details.finished summary{cursor:pointer;color:var(--muted);font-weight:500;padding:6px 0;list-style:none}
details.finished summary::-webkit-details-marker{display:none}
details.finished summary::before{content:"▸ ";display:inline-block;width:1em}
details.finished[open] summary::before{content:"▾ "}
details.finished .list{margin-top:8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

/* detail */
.back{align-self:flex-start}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hero img{width:100%;max-height:360px;object-fit:contain;display:block;background:var(--bg)}
.hero .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .roaster{color:var(--muted);margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.facts dd{margin:0;font-weight:500}
.tasting{margin:0;font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.status{font-size:13px;font-weight:600;color:var(--muted)}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.brew{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.brew:hover{border-color:var(--muted);border-left-color:var(--accent)}
.brew .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brew .method{font-weight:600}
.brew .when{font-size:13px;color:var(--muted)}
.params{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.params span b{font-weight:500}
.params .lbl{color:var(--muted);font-family:var(--font-body);font-size:12px;margin-right:4px}
.brew .notes{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.stars{color:var(--crema);letter-spacing:1px;font-size:15px}
.stars .off{color:var(--line)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:1}
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field .unitwrap{position:relative;display:flex}
.field .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
input[type=date],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px;
}
input.numin{font-family:var(--font-mono);padding-right:44px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.hint{font-size:12px;color:var(--muted);margin:0}
.flabel{font-size:13px;font-weight:500;color:var(--muted)}
.controls{display:flex;flex-direction:column;gap:12px}
.sl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;gap:8px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl-head label{font-size:14px;color:var(--ink);font-weight:500}
.sl-head output{font-size:18px;font-weight:500}
.sl-row{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center}
.sl-row input[type=range]{width:100%;min-width:0;touch-action:pan-y;accent-color:var(--accent);height:32px;margin:0}
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation}
.step:active{background:var(--line)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--font-mono);padding:0 50px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:15px;cursor:pointer;touch-action:manipulation}
.seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.seg.small button{min-height:34px;font-size:14px;padding:4px 10px}
.sl .seg.small button{background:var(--bg)}
.sl .seg.small button[aria-checked="true"]{background:var(--accent)}
.declared{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crema);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.declared p{margin:0;font-style:italic}
.prefill{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.prefill:empty{display:none}
.btn.small{padding:6px 12px;font-size:14px}
.rating{display:flex;gap:6px}
.rating button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--line);cursor:pointer}
.rating button.on{color:var(--crema);border-color:color-mix(in srgb,var(--crema) 50%,var(--line))}
.photo-pick{border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface);min-height:120px;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;color:var(--muted);text-align:center;padding:0}
.photo-pick img{width:100%;max-height:240px;object-fit:contain;display:block}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.calc{font-size:14px;color:var(--muted)}
.calc b{color:var(--ink);font-weight:500}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.confirm .sheet{gap:12px}
.doc{display:flex;flex-direction:column;gap:10px;max-width:680px}
.doc h2{margin-top:18px}
.doc h3{margin-top:10px}
.doc p,.doc ul{margin:0}
.doc ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc a{color:var(--accent)}
.gate{display:flex;flex-direction:column;gap:14px;max-width:560px}
.gate ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.foot .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer;padding:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:16px;border-top:1px solid var(--line)}
.foot .who{width:100%;text-align:center;font-size:13px;color:var(--muted)}
.login{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.login .err{color:var(--danger);margin:0;font-size:14px}
.nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crema);border-radius:12px;padding:10px 12px;font-size:14px}
.nudge .btn{padding:6px 12px;font-size:14px}
.offline{font-size:13px;color:var(--crema);font-weight:500}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.notice p{margin:0}
.card.static{cursor:default}
.card.static:hover{border-color:var(--line)}
.card.mini{grid-template-columns:56px 1fr;gap:12px;padding:8px}
.card.mini .thumb{width:56px;height:56px}
.card .by{font-size:12px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left;cursor:pointer}
.item:hover{border-color:var(--muted)}
.item .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .t b{font-weight:600;overflow-wrap:anywhere}
.item.static{cursor:default}
.item.static:hover{border-color:var(--line)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{padding-top:6px;border-top:1px solid var(--line)}
.cmp{display:flex;flex-direction:column;gap:2px}
.cmp-head,.cmp-row{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:8px;font-size:14px;align-items:start}
.cmp-row span{overflow-wrap:anywhere}
.cmp-row.diff{background:color-mix(in srgb,var(--crema) 22%,transparent)}
.cmp-lbl{color:var(--muted);font-size:12px;padding-top:2px}
.cmp-col{display:flex;flex-direction:column;gap:3px;min-width:0}
.cmp-tag{font-weight:700;font-family:var(--display,inherit)}
.cmp-photo{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.cmp-photo.ph{display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.cmp-warn{border:1px solid var(--crema);background:color-mix(in srgb,var(--crema) 14%,transparent);border-radius:12px;padding:10px 12px;font-size:14px}
.cmp-warn ul{margin:6px 0 0;padding-left:18px}
.dupes{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crema);border-radius:12px;padding:10px 12px}
.dupes:empty{display:none}
.byline{font-size:13px;color:var(--muted);margin:0}
.ok{color:var(--accent);margin:0;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check .t{display:flex;flex-direction:column;gap:2px}
.cb-head{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.cb-head .thumb{width:48px;height:48px;border-radius:8px}
.cb-head .t{display:flex;flex-direction:column;min-width:0}
.cb-head b{font-weight:600;overflow-wrap:anywhere}
.brew .by{font-size:13px;color:var(--muted)}
.pill.pub{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.share-img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bc-body{display:flex;flex-direction:column;gap:14px}
.bc-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:6px}
.bc-row select{width:100%}
/* ruota degli aromi */
.wheel-host{display:flex;flex-direction:column;gap:12px}
.wheel-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-size:14px;min-width:0}
.crumbs button{border:0;background:none;padding:6px 2px;color:var(--accent);font-weight:500;cursor:pointer}
.crumbs span{color:var(--muted)}
.crumbs b{font-weight:600;padding:6px 0}
.seg.lang{flex:0 0 auto;flex-wrap:nowrap}
.seg.lang button{flex:0 0 auto;min-width:44px}
.wheel-box{width:100%;max-width:480px;margin:0 auto;aspect-ratio:1}
svg.wheel{width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:visible;transform-origin:50% 50%}
svg.wheel [role=button]{cursor:pointer;outline:none}
svg.wheel path.a{stroke:var(--bg);stroke-width:1.3;stroke-linejoin:round}
svg.wheel [role=button]:focus-visible path.a,svg.wheel [role=button]:focus-visible circle{stroke:var(--ink);stroke-width:2.5}
svg.wheel text{pointer-events:none;font-family:var(--font-body);font-weight:500}
svg.wheel .sel-bg{fill:none;stroke:var(--bg);stroke-width:6;stroke-linejoin:round;pointer-events:none}
svg.wheel .sel{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;pointer-events:none}
svg.wheel .dot{fill:var(--ink);stroke:var(--bg);stroke-width:1.5;pointer-events:none}
svg.wheel .hub{fill:var(--surface);stroke:var(--line)}
svg.wheel .hub-t{fill:var(--muted);pointer-events:none}
.wheel-pick{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.wheel-pick .field{align-self:stretch}
.aromas{display:flex;flex-wrap:wrap;gap:5px 6px}
.aroma{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.3;padding:3px 10px 3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.aroma i{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent)}
.aroma button{border:0;background:none;padding:0 0 0 2px;margin:-4px -4px -4px 0;width:26px;height:26px;font-size:17px;line-height:1;color:var(--muted);cursor:pointer}
.sheet .aroma,.wheel-pick .aroma{background:var(--surface)}
.aromas.big .aroma{font-size:14px;padding:6px 12px 6px 10px;background:var(--surface);cursor:pointer}
.linkcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;cursor:pointer;width:100%;text-align:left}
.linkcard:hover{border-color:var(--muted)}
.linkcard .t{display:flex;flex-direction:column;flex:1;min-width:0}
.linkcard svg{flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){
  svg.wheel.zin{animation:wzin .22s ease-out}
  svg.wheel.zout{animation:wzout .22s ease-out}
  @keyframes wzin{from{transform:scale(.8);opacity:.35}to{transform:none;opacity:1}}
  @keyframes wzout{from{transform:scale(1.15);opacity:.35}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <div><h1>Diario caffè</h1><p>Caricamento dell'archivio…</p></div>
  </header>
</main>

<script src="config.js"></script>
<script src="legal.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script>
(() => {
"use strict";

/* ---------- configurazione ---------- */
const APP_TITLE = "Diario caffè";
/* Modelli per compilare in fretta il primo macinino (l'utente può cambiare tutto). */

/* ---------- utilità ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const numParse = v => { if (v == null) return null; const s = String(v).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return Number.isFinite(n) ? n : null; };
const fmtNum = n => n == null ? "" : (Math.round(n*1000)/1000).toLocaleString("it-IT", {maximumFractionDigits:3});
const durFmt = n => { if (n == null) return ""; if (n < 60) return n + " s"; const m = Math.floor(n/60), s = n % 60; return m + ":" + String(s).padStart(2,"0"); };
const dayMs = 864e5;
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("it-IT", {day:"numeric", month:"short", year:"numeric"}); };
const fmtWhen = iso => { const d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleDateString("it-IT",{weekday:"short", day:"numeric", month:"short"}) + " · " + d.toLocaleTimeString("it-IT",{hour:"2-digit", minute:"2-digit"}); };
const daysBetween = (a, b) => { const d1 = new Date(a), d2 = new Date(b); if (isNaN(d1)||isNaN(d2)) return null; return Math.floor((Date.UTC(d2.getFullYear(),d2.getMonth(),d2.getDate()) - Date.UTC(d1.getFullYear(),d1.getMonth(),d1.getDate()))/dayMs); };
const ago = iso => { const n = daysBetween(iso, new Date()); if (n == null) return ""; if (n <= 0) return "oggi"; if (n === 1) return "ieri"; return n + " gg fa"; };
const localDT = (d = new Date()) => { const p = x => String(x).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); };
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const CFG = window.DIARIO_CONFIG || {};
const photoUrl = path => String(CFG.supabaseUrl || "").replace(/\/$/, "") + "/storage/v1/object/public/photos/" + String(path).split("/").map(encodeURIComponent).join("/");
const stars = r => { r = r || 0; if (!r) return ""; let s = ""; for (let i=1;i<=5;i++) s += i <= r ? "★" : '<span class="off">★</span>'; return '<span class="stars" aria-label="Voto '+r+' su 5">'+s+"</span>"; };
const beanSvg = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"/><path d="M8.5 5.5c3 3 1 6.5 3.5 9s4 3 3.5 4"/></svg>';
const pick = (o, keys) => { const r = {}; for (const k of keys) if (o[k] !== undefined) r[k] = o[k]; return r; };

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;

}
function errMsg(e){
  const c = e && e.code;
  if (c === "in_use") return "Questo caffè è nella dispensa di altri membri: non si può eliminare dal catalogo.";
  if (c === "too_large") return "La foto è troppo grande.";
  if (c === "invalid_argument") return "Non hai i permessi per questa modifica.";
  return "Salvataggio non riuscito. Controlla la connessione e riprova.";
}
async function retryOnce(fn){
  try { return await fn(); }
  catch(e){ if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); return fn(); } throw e; }
}

/* ---------- macinini ---------- */
const grinderLabel = g => g ? [g.brand, g.model].filter(Boolean).join(" ") + (g.burrs && g.burrs !== "Standard" ? " · " + g.burrs : "") : "";
const grinderList = () => [...S.grinders.values()].sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
function defaultGrinderId(){
  const d = meta().defaultGrinder; if (d && S.grinders.has(d)) return d;
  const l = grinderList(); return l.length ? l[0].id : null;
}
const snap = (v, min, max, step) => { const n = Math.round((Math.min(max, Math.max(min, v)) - min) / step) * step + min; return Math.round(n * 10000) / 10000; };
function grindRange(id, value){
  const g = S.grinders.get(id);
  if (g) return {min:g.min, max:g.max, step:g.step};
  return {min:0, max:Math.max(10, Math.ceil(value || 0)), step:0.1};
}
function convertGrind(from, toId){
  const F = grindRange(from.grinder, from.value), G = grindRange(toId);
  const frac = (from.value - F.min) / ((F.max - F.min) || 1);
  return snap(G.min + frac * (G.max - G.min), G.min, G.max, G.step);
}
function defaultGrind(method, gid, from){
  const saved = savedDefaults()[method], G = grindRange(gid);
  if (saved && saved.grinder === gid && saved.grind != null) return snap(saved.grind, G.min, G.max, G.step);
  const last = S.brews.find(b => b.method === method && b.params && b.params.grinder === gid && b.params.grind != null);
  if (last) return snap(last.params.grind, G.min, G.max, G.step);
  if (from && from.value != null) return convertGrind(from, gid);
  return snap((G.min + G.max) / 2, G.min, G.max, G.step);
}
/* ---------- macchine espresso ---------- */
const machineLabel = m => m ? [m.brand, m.model].filter(Boolean).join(" ") : "";
const machineList = () => [...S.machines.values()].sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
function defaultMachineId(){
  const last = S.brews.find(b => b.params && b.params.machine && S.machines.has(b.params.machine));
  if (last) return last.params.machine;
  const l = machineList(); return l.length ? l[0].id : null;
}

function methodDefaults(method){
  const m = METHODS[method], saved = savedDefaults()[method];
  const v = {...m.defaults, ...(saved || {})};
  delete v.grinderLabel;
  const gid = saved && saved.grinder && S.grinders.has(saved.grinder) ? saved.grinder : defaultGrinderId();
  if (gid){ v.grinder = gid; v.grind = defaultGrind(method, gid); } else { delete v.grinder; delete v.grind; }
  if (m.bloomAuto && !(saved && saved.bloomWater != null)) v.bloomWater = Math.round(v.dose * m.bloomAuto);
  delete v.machineLabel;
  if (m.fields.includes("machine")){
    const mid = saved && saved.machine && S.machines.has(saved.machine) ? saved.machine : defaultMachineId();
    if (mid) v.machine = mid; else delete v.machine;
  } else delete v.machine;
  return v;
}
function methodRatio(method){
  const saved = savedDefaults()[method];
  if (saved && saved.dose){ const out = saved.yield ?? saved.water; if (out) return Math.round(out / saved.dose * 10) / 10; }
  return METHODS[method]?.ratio;
}

function currentId(){ const h = location.hash.slice(1); return h.startsWith("c-") ? h.slice(2) : null; }
function go(id){ location.hash = id ? "c-" + id : ""; if (!id) history.replaceState(null, "", location.pathname + location.search); render(); }
const isCommunity = () => location.hash === "#community";
function goCommunity(catalogId){
  S.communityFilter = catalogId || null; S.cfilter = "all";
  if (!isCommunity()) location.hash = "community"; else render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

/* ---------- render ---------- */
function render(){
  if (location.hash === "#info"){ renderInfo(); return; }
  if (S.needPassword){ renderSetPassword(); return; }
  if (S.needLogin){ renderLogin(); return; }
  if (!db){
    app.innerHTML = '<header class="top"><div><h1>'+APP_TITLE+'</h1></div></header>' +
      '<div class="notice"><p>' + esc(S.error || "Caricamento dell'archivio…") + "</p></div>";
    return;
  }
  if (!S.loaded){
    app.innerHTML = '<header class="top"><div><h1>'+APP_TITLE+'</h1><p>' +
      (S.error ? esc(S.error) : S.slow ? "L'archivio non risponde ancora. Controlla la connessione: i dati compariranno appena raggiungibili." : "Caricamento dell'archivio…") +
      "</p></div></header>";
    return;
  }
  if (needsTerms()){ renderTermsGate(); return; }
  if (isCommunity()){ renderCommunity(); return; }
  if (location.hash === "#ruota"){ renderAromaPage(); return; }
  const id = currentId();
  if (id && S.bags.has(id)) renderDetail(view(S.bags.get(id)));
  else renderLibrary();
}

  : '<div class="thumb ph">'+beanSvg+"</div>";

function coffeeCard(c){
  const bs = brewsOf(c.id);
  const last = bs[0];
  const rd = c.roastDate ? daysBetween(c.roastDate, new Date()) : null;
  const origin = [c.origin, c.process].filter(Boolean).map(esc).join(" · ");
  let meta = [];
  if (!c.finished && rd != null && rd >= 0) meta.push('<span class="pill'+(rd>=7 && rd<=35 ? " fresh":"")+'">'+rd+" gg dalla tostatura</span>");
  if (c.finished && c.finishedAt) meta.push("<span>Finito il " + fmtDate(c.finishedAt) + "</span>");
  meta.push("<span>" + bs.length + (bs.length === 1 ? " estrazione" : " estrazioni") + "</span>");
  if (last) meta.push("<span>ultima: " + esc(methodLabel(last.method)) + ", " + ago(last.at) + "</span>");
  return '<button class="card'+(c.finished?" done":"")+'" data-open="'+esc(c.id)+'">' + thumbHtml(c.photo) +
    '<div class="t"><span class="name">'+esc(c.name)+"</span>" +
    (c.roaster ? '<span class="sub">'+esc(c.roaster)+"</span>" : "") +
    (origin ? '<span class="sub">'+origin+"</span>" : "") +
    '<span class="meta">'+meta.join("")+"</span></div></button>";
}

function renderLibrary(){
  const all = [...S.bags.values()].map(view);
  /* in dispensa: prima quelli già estratti (ultima estrazione più recente in alto),
     poi quelli senza estrazioni per data di tostatura (il più vecchio in alto; senza data in fondo) */
  const lastAt = c => (brewsOf(c.id)[0] || {}).at || "";
  const active = all.filter(c => !c.finished).sort((a, b) => {
    const la = lastAt(a), lb = lastAt(b);
    if (la || lb) return la && lb ? lb.localeCompare(la) : la ? -1 : 1;
    if (a.roastDate || b.roastDate) return a.roastDate && b.roastDate ? a.roastDate.localeCompare(b.roastDate) : a.roastDate ? -1 : 1;
    return (b.createdAt || "").localeCompare(a.createdAt || "");
  });
  const done = all.filter(c => c.finished).sort((a,b) => (b.finishedAt||"").localeCompare(a.finishedAt||""));
  const monthAgo = Date.now() - 30*dayMs;
  const recent = S.brews.filter(b => new Date(b.at).getTime() >= monthAgo).length;
  const summary = all.length
    ? active.length + " caffè in dispensa · " + recent + (recent === 1 ? " estrazione" : " estrazioni") + " negli ultimi 30 giorni"
    : S.catalog.size + (S.catalog.size === 1 ? " caffè" : " caffè") + " nel catalogo della community";
  let html = navHtml("home") + '<header class="top"><div><h1>'+APP_TITLE+'</h1><p>'+summary+'</p>' + (S.offline ? '<p class="offline">Offline: vedi i dati dell\'ultima sincronizzazione. Le modifiche si salvano solo con la connessione.</p>' : "") + '</div>' +
    '<button class="btn primary" data-act="new-coffee">+ Caffè</button></header>' + nudgesHtml(all.length) +
    '<button class="linkcard" data-act="wheel">' + miniWheel() + '<span class="t"><b>Ruota degli aromi</b><span class="small muted">Consultala e ritrova gli aromi delle estrazioni</span></span><span class="muted" aria-hidden="true">›</span></button>';
  html += '<section class="list" aria-label="In dispensa">';
  if (!active.length){
    html += '<div class="empty"><p>' + (all.length ? "Nessun caffè in dispensa: tutti terminati." : "Cerca il caffè che hai comprato nel catalogo della community, oppure crea tu la scheda con la foto della confezione.") +
      '</p><button class="btn primary" data-act="new-coffee">Aggiungi un caffè</button></div>';
  } else html += active.map(coffeeCard).join("");
  html += "</section>";
  if (done.length){
    html += '<details class="finished"><summary>Terminati ('+done.length+")</summary><div class=\"list\">" + done.map(coffeeCard).join("") + "</div></details>";
  }
  html += footerHtml();
  app.innerHTML = html;
}

const grinderName = p => { const g = S.grinders.get(p.grinder); return g ? grinderLabel(g) : (p.grinderLabel || ""); };
const machineName = p => { if (!p.machine) return ""; const m = S.machines.get(p.machine); return m ? machineLabel(m) : (p.machineLabel || ""); };
function paramRaw(k, v, p){
  const f = FIELDS[k] || {label:k};
  if (k === "grind"){ const l = grinderName(p); return fmtNum(v) + (l ? " · " + l : ""); }
  if (typeof v === "boolean") return v ? "Sì" : "No";
  if (f.dur) return durFmt(v);
  if (typeof v === "number") return fmtNum(v) + (f.unit ? " " + f.unit : "");
  return String(v);
}
const paramText = (k, v, p) => esc(paramRaw(k, v, p));
/* parametri da mostrare, in ordine: [etichetta, chiave, valore] */
function brewParams(b){
  const p = b.params || {}, out = [];
  for (const k of DISPLAY_ORDER){
    const v = p[k];
    if (v == null || v === "") continue;
    if ((k === "time" || k === "bypass" || k === "preinf" || k === "steep") && v === 0) continue;
    if (FIELDS[k] && FIELDS[k].type === "check" && !v) continue;
    out.push([k === "bypass" ? "Bypass" : (FIELDS[k]?.label || k), k, v]);
  }
  const r = ratioText(b.method, p);
  if (r) out.splice(Math.min(2, out.length), 0, ["Rapporto", "ratio", r]);
  return out;
}
const brewTitle = b => { const p = b.params || {}; return [methodLabel(b.method), machineName(p), p.dripper, p.device].filter(Boolean).join(" · "); };
/* giorni dalla tostatura: dalla propria confezione, oppure quelli salvati con l'estrazione condivisa */
function brewAge(b){
  const bag = b.owner && b.owner !== me() ? null : S.bags.get(b.coffeeId);
  if (bag && bag.roastDate){ const a = daysBetween(bag.roastDate, b.at); return a != null && a >= 0 ? a : null; }
  return b.roastDays != null && b.roastDays >= 0 ? b.roastDays : null;
}
function brewInner(b){
  const p = b.params || {};
  const parts = brewParams(b).map(([lbl, k, v]) => '<span><span class="lbl">'+esc(lbl)+'</span><b class="num">'+(k === "ratio" ? esc(v) : paramText(k, v, p))+"</b></span>");
  const age = brewAge(b);
  return '<div class="row"><span class="method">'+esc(brewTitle(b))+"</span>"+stars(b.rating)+"</div>" +
    '<div class="when">'+fmtWhen(b.at)+(age != null ? " · "+age+" gg dalla tostatura" : "")+"</div>" +

  const act = el.dataset.act;

});

/* ---------- foto: ridimensiona e comprimi ---------- */
function compress(file, max = 1400, q = 0.82){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("toBlob")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}
async function uploadPhoto(file){
  let blob; try { blob = await compress(file); } catch { blob = file; }
  const type = blob.type && /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : "image/jpeg";
  return (await retryOnce(() => assets.upload(blob, {type}))).id;
}

    (origin ? '<span class="sub">'+origin+"</span>" : "") +
    '<span class="by">'+by+"</span></div></button>";

function searchCatalog(q, exclude){
  const words = norm(q).split(" ").filter(Boolean);
  let items = [...S.catalog.values()].filter(k => k.id !== exclude);
  if (words.length){
    items = items.filter(k => { const hay = norm([k.name, k.roaster, k.origin, k.variety, k.process, k.tasting].join(" ")); return words.every(w => hay.includes(w)); });
    items.sort((a,b) => norm(a.name).localeCompare(norm(b.name)));
  } else items.sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  return items;
}

function bagSheet(k, bag, prefill){
  if (!k) return;
  const isNew = !bag; bag = bag || {};
  const already = isNew && bagsOf(k.id).some(b => !b.finished);
  const inner = '<div class="card mini static">' + thumbHtml(k.photo) + '<div class="t"><span class="name">'+esc(k.name)+"</span>" +
      (k.roaster ? '<span class="sub">'+esc(k.roaster)+"</span>" : "") +

      (k.tasting ? '<span class="by">Note dichiarate: '+esc(k.tasting)+"</span>" : "") + "</div></div>" +
    '<div class="actions">' + (canEdit(k) ? '<button type="button" class="btn small" id="bg-edit-entry">Modifica scheda</button>' : "") +
      '<button type="button" class="btn small" id="bg-dup">' + (S.isAdmin ? "Unisci con un doppione" : "Segnala doppione") + "</button></div>" +
    (already ? '<p class="hint">Hai già questo caffè in dispensa: verrà aggiunta un\'altra confezione.</p>' : "") +
    '<form id="bg" novalidate><span class="flabel">La tua confezione</span>' + bagFieldsHtml(isNew && prefill ? prefill : bag) +
    '<div class="form-foot">' + (isNew ? "<span></span>" : '<button type="button" class="btn danger" id="bg-del">Togli dalla dispensa</button>') +
    '<button type="submit" class="btn primary" id="bg-save">'+(isNew ? "Aggiungi alla dispensa" : "Salva")+"</button></div></form>";
  const s = openSheet(isNew ? "Aggiungi alla dispensa" : "Modifica confezione", inner);
  const $ = sel => s.el.querySelector(sel);
  const ee = $("#bg-edit-entry");
  if (ee) ee.addEventListener("click", () => { s.close(); entrySheet(k); });
  $("#bg-dup").addEventListener("click", () => { s.close(); duplicateFlow(k); });
  const del = $("#bg-del");
  if (del) del.addEventListener("click", async () => {
    const n = brewsOf(bag.id).length;
    if (!(await confirmBox("Togliere “"+k.name+"” dalla dispensa" + (n ? " ed eliminare le sue "+n+" estrazioni" : "") + "? La scheda resta nel catalogo. Non si può annullare.", "Elimina"))) return;
    try {
      for (const b of brewsOf(bag.id)) await retryOnce(() => db.collection("brews").doc(b.id).delete());
      await retryOnce(() => db.collection("coffees").doc(bag.id).delete());
      loadCounts(); s.close(); go(null); toast("Confezione eliminata");
    } catch(e){ toast(errMsg(e)); }
  });
  $("#bg").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#bg-save"); btn.disabled = true; btn.textContent = "Salvo…";
    try {
      const data = {catalogId: k.id, ...readBagFields($), finished: !!bag.finished, finishedAt: bag.finishedAt || null, createdAt: bag.createdAt || new Date().toISOString()};
      const id = bag.id || uid("c");
      await retryOnce(() => db.collection("coffees").doc(id).set(data));
      loadCounts(); s.close();
      if (isNew) go(id);
      toast(isNew ? "Aggiunto alla dispensa" : "Modifiche salvate");
    } catch(err){ btn.disabled = false; btn.textContent = isNew ? "Aggiungi alla dispensa" : "Salva"; toast(errMsg(err)); }
  });
}

  const tpl = $("#gf-tpl");

  if (tpl) tpl.addEventListener("change", () => {
    const t = presets[Number(tpl.value)]; if (!t || tpl.value === "") return;
    $("#gf-brand").value = t.brand || ""; $("#gf-model").value = t.model || "";
    $("#gf-min").value = fmtNum(t.min); $("#gf-max").value = fmtNum(t.max); $("#gf-step").value = fmtNum(t.step);
    const custom = t.burrs && t.burrs !== "Standard";
    setBurrs(custom); if (custom) $("#gf-burrname").value = t.burrs;
  });
  if (isNew) setTimeout(() => { const ae = document.activeElement; if (!ae || ae === document.body || !s.el.contains(ae) || ae.matches("[data-close]")) $("#gf-brand").focus(); }, 50);

  const del = $("#gf-del");
  if (del) del.addEventListener("click", async () => {
    if (!(await confirmBox("Eliminare “"+grinderLabel(g)+"”? Le estrazioni già salvate mantengono il nome del macinino.", "Elimina"))) return;
    try { await retryOnce(() => db.collection("grinders").doc(g.id).delete()); s.close(); toast("Macinino eliminato"); if (onSaved) onSaved(null); }
    catch(e){ toast(errMsg(e)); }

  $("#gf").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#gf-err"); err.hidden = true;
    const fail = (msg, el) => { err.hidden = false; err.textContent = msg; if (el) el.focus(); };
    const brand = $("#gf-brand").value.trim(), model = $("#gf-model").value.trim();
    const burrs = burrsCustom ? ($("#gf-burrname").value.trim() || "") : "Standard";
    const min = numParse($("#gf-min").value), max = numParse($("#gf-max").value), step = numParse($("#gf-step").value);
    if (!model) return fail("Scrivi il modello.", $("#gf-model"));
    if (burrsCustom && !burrs) return fail("Scrivi il nome delle macine, oppure scegli Standard.", $("#gf-burrname"));
    if (min == null) return fail("Inserisci il valore minimo.", $("#gf-min"));
    if (max == null) return fail("Inserisci il valore massimo.", $("#gf-max"));
    if (max <= min) return fail("Il valore massimo deve essere più alto del minimo.", $("#gf-max"));
    if (step == null || step <= 0) return fail("Lo step deve essere un numero maggiore di zero.", $("#gf-step"));
    if (step > max - min) return fail("Lo step è più grande dell'intera scala.", $("#gf-step"));
    if ((max - min) / step > 2000) return fail("Con questo step la scala ha più di 2000 posizioni: controlla i valori.", $("#gf-step"));
    const btn = $("#gf-save"); btn.disabled = true; btn.textContent = "Salvo…";
    try {
      const id = g.id || uid("g");
      const data = {brand, model, burrs, min, max, step, createdAt: g.createdAt || new Date().toISOString()};
      await retryOnce(() => db.collection("grinders").doc(id).set(data));
      if (makeDefault && meta().defaultGrinder !== id) await setMeta({defaultGrinder: id}).catch(() => {});
      else if (!makeDefault && meta().defaultGrinder === id) await setMeta({defaultGrinder: null}).catch(() => {});
      s.close(); render(); loadPresets(); toast(isNew ? "Macinino aggiunto" : "Macinino aggiornato");
      if (onSaved) onSaved(S.grinders.get(id));
    } catch(e2){ btn.disabled = false; btn.textContent = isNew ? "Aggiungi" : "Salva"; toast(errMsg(e2)); }
  });
}

/* ---------- doppioni nel catalogo ---------- */
/* parole che non distinguono un caffè o una torrefazione */
const GENERIC = new Set(["coffee","coffees","caffe","cafe","roasters","roaster","roastery","roasting","torrefazione","torrefattori","specialty","company","co","the","and","di","de","del","della","la","las","el","los","le","il","lo","e","y"]);
const toks = s => norm(s).replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w.length > 1 && !GENERIC.has(w));
/* true = stessa torrefazione (anche scritta diversamente), false = diversa, null = non indicata */
function roasterSame(a, b){ const A = toks(a), B = toks(b); if (!A.length || !B.length) return null; return A.some(w => B.includes(w)); }
function nameScore(a, b){
  if (norm(a) && norm(a) === norm(b)) return 1;
  const A = new Set(toks(a)), B = new Set(toks(b)); if (!A.size || !B.size) return 0;
  let i = 0; A.forEach(w => { if (B.has(w)) i++; });
  return Math.max(i / (A.size + B.size - i), 0.9 * i / Math.min(A.size, B.size));
}
const dupScore = (x, y) => roasterSame(x.roaster, y.roaster) === false ? 0 : nameScore(x.name, y.name);
const DUP_MIN = 0.75;
const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
function likelyDuplicates(x, excludeId){
  return [...S.catalog.values()].filter(k => k.id !== excludeId)
    .map(k => [k, dupScore(x, k)]).filter(([, sc]) => sc >= DUP_MIN).sort((p, q) => q[1] - p[1]).map(([k]) => k);
}
/* coppie da controllare (amministratori): segnalate dai membri + trovate automaticamente, meno quelle "non doppioni" */
function pendingPairs(){
  const dismissed = new Set(S.pairs.filter(p => p.status === "dismissed").map(p => pairKey(p.a, p.b)));
  const out = new Map();
  for (const p of S.pairs) if (p.status === "reported" && S.catalog.has(p.a) && S.catalog.has(p.b)) out.set(pairKey(p.a, p.b), {a: p.a, b: p.b, by: p.reported_by});
  const list = [...S.catalog.values()];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++){
    const key = pairKey(list[i].id, list[j].id);
    if (!out.has(key) && !dismissed.has(key) && dupScore(list[i], list[j]) >= DUP_MIN) out.set(key, {a: list[i].id, b: list[j].id, auto: true});
  }
  return [...out.values()].filter(p => !dismissed.has(pairKey(p.a, p.b)));
}
const CMP_FIELDS = [["name","Nome"],["roaster","Torrefazione"],["origin","Origine"],["variety","Varietà"],["process","Processo"],["profile","Profilo"],["tasting","Note dichiarate"]];
function criticalDiffs(a, b){
  const w = [];
  if (roasterSame(a.roaster, b.roaster) === false) w.push("Torrefazione diversa: " + a.roaster + " / " + b.roaster);
  for (const [f, l] of [["process","Processo diverso"],["variety","Varietà diversa"],["profile","Profilo di tostatura diverso"]])
    if (a[f] && b[f] && norm(a[f]) !== norm(b[f])) w.push(l + ": " + a[f] + " / " + b[f]);
  return w;
}
const sharedCount = k => communityBrews().filter(x => brewCatalogId(x) === k.id).length;
function compareHtml(a, b, la, lb){
  const col = (k, l) => '<div class="cmp-col"><span class="cmp-tag">' + esc(l) + "</span>" +
    (k.previewUrl || k.photo ? '<img class="cmp-photo" src="' + esc(k.previewUrl || photoUrl(k.photo)) + '" alt="">' : '<div class="cmp-photo ph">' + beanSvg + "</div>") +
    (k.draft ? '<span class="small muted">la tua nuova scheda</span>'
      : '<span class="small muted">di ' + esc(creatorName(k)) + '</span><span class="small muted">' + (S.counts.get(k.id) || 0) + " in dispensa · " + sharedCount(k) + " condivise</span>") + "</div>";
  const warn = criticalDiffs(a, b);
  const rows = CMP_FIELDS.map(([f, l]) => {
    const va = a[f] || "", vb = b[f] || "", diff = norm(va) !== norm(vb);
    const cell = v => v ? esc(v) : '<span class="muted">—</span>';
    return '<div class="cmp-row' + (diff ? " diff" : "") + '"><span class="cmp-lbl">' + l + "</span><span>" + cell(va) + "</span><span>" + cell(vb) + "</span></div>";
  });
  return (warn.length ? '<div class="cmp-warn"><b>Attenzione: potrebbero essere due caffè diversi</b><ul>' + warn.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
    '<div class="cmp"><div class="cmp-head"><span></span>' + col(a, la) + col(b, lb) + "</div>" + rows.join("") +
    '<p class="hint" style="margin:4px 0 0">Le righe evidenziate sono quelle diverse.</p></div>';
}
/* alla creazione: "è lo stesso caffè?" → "use" | "new" | null */
function sameCoffeeSheet(draft, existing){
  return new Promise(res => {
    const s = openSheet("È lo stesso caffè?", '<p style="margin:0">Nel catalogo c\'è già una scheda molto simile. Se è lo stesso caffè, usa quella: così le estrazioni di tutti restano insieme.</p>' +
      compareHtml(draft, existing, "Nuova", "Nel catalogo") +
      '<div class="form-foot" style="flex-wrap:wrap;gap:8px"><button type="button" class="btn" data-x="new">È un caffè diverso, crea la scheda</button><button type="button" class="btn primary" data-x="use">È lo stesso, usa quella del catalogo</button></div>');
    let done = false;
    const finish = v => { if (done) return; done = true; s.close(); res(v); };
    s.el.querySelector(".form-foot").addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (b) finish(b.dataset.x); });
    s.el.querySelector("[data-close]").addEventListener("click", () => finish(null));
  });
}
/* scegli un'altra scheda del catalogo (le più simili in alto) */
function pickEntrySheet(k, title, onPick){
  const inner = '<p class="hint" style="margin-top:-8px">Quale scheda è un doppione di “' + esc(k.name) + "”?</p>" +
    '<div class="field"><label for="pk-q" class="sr">Cerca</label><input type="search" id="pk-q" autocomplete="off" placeholder="Cerca nel catalogo…"></div><div class="list" id="pk-list"></div>';
  const s = openSheet(title, inner);
  const $ = sel => s.el.querySelector(sel);
  const draw = () => {
    const q = $("#pk-q").value;
    let items = searchCatalog(q, k.id);
    if (!q.trim()) items = items.map(x => [x, dupScore(k, x)]).sort((p, r) => r[1] - p[1]).map(([x]) => x);
    $("#pk-list").innerHTML = items.slice(0, 60).map(entryCard).join("") || '<p class="hint">Nessun caffè trovato.</p>';
  };
  draw();
  $("#pk-q").addEventListener("input", draw);
  $("#pk-list").addEventListener("click", e => { const b = e.target.closest("[data-entry]"); if (!b) return; const o = S.catalog.get(b.dataset.entry); if (o){ s.close(); onPick(o); } });
}
/* membro: segnala agli amministratori; amministratore: apre direttamente l'unione */
function duplicateFlow(k){
  if (!k) return;
  if (S.isAdmin) pickEntrySheet(k, "Unisci con un doppione", o => mergeSheet(k, o));
  else pickEntrySheet(k, "Segnala un doppione", o => reportSheet(k, o));
}
function reportSheet(a, b){
  const key = pairKey(a.id, b.id);
  const already = S.pairs.some(p => pairKey(p.a, p.b) === key);
  const s = openSheet("Segnala doppione", '<p style="margin:0">Gli amministratori controlleranno le due schede e, se sono lo stesso caffè, le uniranno. Le tue confezioni ed estrazioni non cambiano.</p>' +
    compareHtml(a, b, "A", "B") +
    '<div class="form-foot"><span></span><button type="button" class="btn primary" id="rp-go"' + (already ? " disabled" : "") + ">" + (already ? "Già segnalato" : "Segnala agli amministratori") + "</button></div>");
  const btn = s.el.querySelector("#rp-go");
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Invio…";
    const [x, y] = a.id < b.id ? [a.id, b.id] : [b.id, a.id];
    const {error} = await sb.from("catalog_pairs").upsert({a: x, b: y, status: "reported", reported_by: me()}, {onConflict: "a,b", ignoreDuplicates: true});
    if (error){ btn.disabled = false; btn.textContent = "Segnala agli amministratori"; toast(errMsg(wrapErr(error))); return; }
    S.pairs.push({a: x, b: y, status: "reported", reported_by: me()}); saveCache();
    s.close(); toast("Segnalazione inviata agli amministratori");
  });
}
function mergeSheet(a, b, onDone){
  if (!S.isAdmin || !a || !b) return;
  const score = k => [S.counts.get(k.id) || 0, -(new Date(k.createdAt || 0).getTime())];
  const sa = score(a), sb2 = score(b);
  let keep = (sa[0] > sb2[0] || (sa[0] === sb2[0] && sa[1] >= sb2[1])) ? "a" : "b";
  const inner = compareHtml(a, b, "A", "B") +
    '<div class="field"><span class="flabel">Quale scheda tenere?</span><div class="seg" id="mg-keep" role="radiogroup" aria-label="Scheda da tenere">' +
      '<button type="button" role="radio" data-v="a">Tieni A</button><button type="button" role="radio" data-v="b">Tieni B</button></div></div>' +
    '<p class="hint" id="mg-sum" style="margin:0"></p>' +
    '<div class="form-foot" style="flex-wrap:wrap;gap:8px"><button type="button" class="btn" id="mg-no">Non sono doppioni</button><button type="button" class="btn primary" id="mg-go">Unisci</button></div>';
  const s = openSheet("Unisci schede", inner);
  const $ = sel => s.el.querySelector(sel);
  const draw = () => {
    $("#mg-keep").querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-checked", String(x.dataset.v === keep)));
    const K = keep === "a" ? a : b, D = keep === "a" ? b : a, L = keep === "a" ? "A" : "B", DL = keep === "a" ? "B" : "A";
    const nD = S.counts.get(D.id) || 0;
    $("#mg-sum").textContent = "Resta la scheda " + L + " (“" + K.name + "”). " +
      (nD ? "Le confezioni di " + nD + (nD === 1 ? " membro" : " membri") + " e le loro estrazioni passano dalla " + DL + " alla " + L + ". " : "") +
      "I campi vuoti della " + L + " vengono completati con quelli della " + DL + "; poi la " + DL + " viene eliminata.";
  };
  draw();
  $("#mg-keep").addEventListener("click", e => { const x = e.target.closest("[data-v]"); if (x){ keep = x.dataset.v; draw(); } });
  $("#mg-no").addEventListener("click", async () => {
    const [x, y] = a.id < b.id ? [a.id, b.id] : [b.id, a.id];
    const {error} = await sb.from("catalog_pairs").upsert({a: x, b: y, status: "dismissed"}, {onConflict: "a,b"});
    if (error){ toast(errMsg(wrapErr(error))); return; }
    S.pairs = S.pairs.filter(p => pairKey(p.a, p.b) !== pairKey(x, y)); S.pairs.push({a: x, b: y, status: "dismissed"}); saveCache();
    s.close(); render(); toast("Segnate come schede diverse"); if (onDone) onDone();
  });
  $("#mg-go").addEventListener("click", async () => {
    const K = keep === "a" ? a : b, D = keep === "a" ? b : a;
    const warn = criticalDiffs(a, b).length ? " Attenzione: alcuni campi importanti sono diversi." : "";
    if (!(await confirmBox("Unire le due schede tenendo “" + K.name + "” ed eliminare l'altra? Non si può annullare." + warn, "Unisci"))) return;
    const btn = $("#mg-go"); btn.disabled = true; btn.textContent = "Unisco…";
    const {data, error} = await sb.rpc("merge_catalog", {keep_id: K.id, drop_id: D.id});
    if (error){ btn.disabled = false; btn.textContent = "Unisci"; toast(error.code === "42501" ? "Solo gli amministratori possono unire le schede." : errMsg(wrapErr(error))); return; }
    if (data && data.dropPhoto) assets.delete(data.dropPhoto).catch(() => {});
    s.close();
    await refresh();
    toast("Schede unite" + (data ? ": " + data.bags + (data.bags === 1 ? " confezione" : " confezioni") + " e " + data.brews + " estrazioni condivise spostate" : ""));
    if (onDone) onDone();
  });
}
function duplicatesSheet(){

/* ---------- form estrazione ---------- */
function valueOut(k, v){
  const f = FIELDS[k];
  if (k === "grind") return fmtNum(v);
  if (f.dur) return v ? durFmt(v) : "0 s";
  return fmtNum(v) + (f.unit ? " " + f.unit : "");
}
const fieldDef = (method, k) => ({...FIELDS[k], ...((METHODS[method] && METHODS[method].ranges && METHODS[method].ranges[k]) || {})});
function controlHtml(k, vals, method){
  const f = fieldDef(method, k), v = vals[k], id = "bf-" + k;
  if (f.type === "check"){
    return '<label class="check" for="'+id+'"><input type="checkbox" id="'+id+'" data-check="'+k+'"'+(v ? " checked" : "")+'><span class="t"><b>'+esc(f.label)+"</b></span></label>";
  }
  if (f.type === "choice"){
    return '<div class="field"><span class="flabel">'+f.label+'</span><div class="seg" data-k="'+k+'" role="radiogroup" aria-label="'+f.label+'">' +
      f.options.map(o => '<button type="button" role="radio" data-v="'+esc(o)+'" aria-checked="'+(v===o)+'">'+esc(o)+"</button>").join("") + "</div></div>";
  }
  if (f.type === "machine"){
    const opts = machineList().map(m => [m.id, machineLabel(m)]);
    if (v && !S.machines.has(v)) opts.push([v, vals.machineLabel || "Macchina eliminata"]);
    if (!opts.length) return '<div class="field"><span class="flabel">Macchina</span><p class="hint">Aggiungi la tua macchina espresso per registrarla nelle estrazioni.</p>' +
      '<button type="button" class="btn small" data-addmachine style="align-self:flex-start">+ Macchina</button></div>';
    return '<div class="field"><span class="flabel">Macchina</span><div class="seg" data-k="machine" role="radiogroup" aria-label="Macchina">' +
      opts.map(([mk, l]) => '<button type="button" role="radio" data-v="'+esc(mk)+'" aria-checked="'+(v===mk)+'">'+esc(l)+"</button>").join("") + "</div></div>";
  }
  if (f.type === "bool"){
    return '<div class="field"><span class="flabel">'+f.label+'</span><div class="seg" data-k="'+k+'" data-bool="1" role="radiogroup" aria-label="'+f.label+'">' +
      '<button type="button" role="radio" data-v="1" aria-checked="'+(v===true)+'">Sì</button><button type="button" role="radio" data-v="0" aria-checked="'+(v===false)+'">No</button></div></div>';
  }
  let min = f.min, max = f.max, step = f.step, head = f.label, extra = "";
  if (f.type === "grind"){
    const list = grinderList();
    if (!vals.grinder){
      return '<div class="field sl" data-k="grind"><div class="sl-head"><span class="flabel">Macinatura</span></div>' +
        '<p class="hint">Aggiungi il tuo macinino per registrare la macinatura.</p><button type="button" class="btn small" data-addgrinder style="align-self:flex-start">+ Macinino</button></div>';
    }
    const G = grindRange(vals.grinder, vals.grind);
    min = G.min; max = G.max; step = G.step;
    const opts = list.map(g => [g.id, grinderLabel(g)]);
    if (!S.grinders.has(vals.grinder)) opts.push([vals.grinder, vals.grinderLabel || "Macinino eliminato"]);
    extra = opts.length > 1
      ? '<div class="seg small" data-k="grinder" role="radiogroup" aria-label="Macinino">' +
        opts.map(([gk, l]) => '<button type="button" role="radio" data-v="'+esc(gk)+'" aria-checked="'+(vals.grinder===gk)+'">'+esc(l)+"</button>").join("") + "</div>"
      : '<p class="hint">'+esc(opts[0][1])+"</p>";
  }
  const val = v == null ? min : v;
  const mid = f.type === "grind" ? '<div class="scale"><span>'+fmtNum(min)+' fine</span><span>'+fmtNum(max)+' grossolana</span></div>' : "";
  return '<div class="field sl" data-k="'+k+'">' +
    '<div class="sl-head"><label for="'+id+'">'+head+'</label><output class="num" id="'+id+'-out">'+valueOut(k, val)+"</output></div>" + extra +
    '<div class="sl-row"><button type="button" class="step" data-d="-1" aria-label="Diminuisci '+esc(head)+'">−</button>' +
    '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">' +
    '<button type="button" class="step" data-d="1" aria-label="Aumenta '+esc(head)+'">+</button></div>' + mid + "</div>";
}

function brewSheet(coffee, b){
  if (!coffee) return;
  const isNew = !b;
  const lastMethod = (brewsOf(coffee.id).find(x => METHODS[x.method]) || S.brews.find(x => METHODS[x.method]) || {}).method || "espressoClassico";
  let method = b ? b.method : lastMethod;
  let rating = b ? (b.rating || 0) : 0;
  let vals = b ? {...(b.params || {})} : methodDefaults(method);
  let bloomLinked = isNew;
  const aromas = new Set(sortAromas(b?.aromas));
  const methodKeys = Object.keys(METHODS).concat(METHODS[method] ? [] : [method]);

  const inner = '<form id="bf" novalidate>' +
    '<p class="hint" style="margin-top:-8px">'+esc(coffee.name)+(coffee.roaster?" · "+esc(coffee.roaster):"")+"</p>" +
    (isNew ? "" : '<button type="button" class="btn small" id="bf-share" style="align-self:flex-start">Condividi come immagine</button>') +
    '<div class="field"><span class="flabel">Metodo</span><div class="chips" role="radiogroup" id="bf-methods">' +
      methodKeys.map(k => '<button type="button" class="chip" role="radio" data-m="'+esc(k)+'" aria-pressed="'+(k===method)+'" aria-checked="'+(k===method)+'">'+esc(methodLabel(k))+"</button>").join("") +
    "</div></div>" +
    '<div class="field"><label for="bf-at">Data e ora</label><input type="datetime-local" id="bf-at" value="'+(b ? localDT(new Date(b.at)) : localDT())+'"></div>' +
    '<div class="prefill" id="bf-prefill"></div>' +
    '<div class="controls" id="bf-fields"></div>' +
    '<p class="calc" id="bf-calc"></p>' +
    '<div class="prefill" id="bf-defs"></div>' +
    (coffee.tasting ? '<div class="declared"><span class="flabel">Note dichiarate in busta</span><p>'+esc(coffee.tasting)+'</p></div>' : "") +
    '<div class="field" id="bf-aromi"><span class="flabel">Aromi percepiti</span><div class="aromas" id="bf-aromas"></div><button type="button" class="btn small" id="bf-wheel" style="align-self:flex-start"></button></div>' +
    '<div class="field"><span class="flabel">Voto</span><div class="rating" id="bf-rating">' + [1,2,3,4,5].map(i => '<button type="button" data-r="'+i+'" aria-label="'+i+' su 5">★</button>').join("") + "</div></div>" +
    '<div class="field"><label for="bf-notes">Risultato estrazione</label><textarea id="bf-notes" placeholder="Gusto, corpo, acidità, difetti, cosa cambiare la prossima volta…">'+esc(b?.notes||"")+"</textarea></div>" +
    '<label class="check" for="bf-public"><input type="checkbox" id="bf-public"'+(b && b.public ? " checked" : "")+'><span class="t"><b>Condividi nella Community</b><span class="hint">Gli altri membri vedranno caffè, metodo, parametri, aromi, voto e note di questa estrazione.</span></span></label>' +
    '<div class="form-foot">' + (isNew ? "<span></span>" : '<button type="button" class="btn danger" id="bf-del">Elimina</button>') +
    '<button type="submit" class="btn primary" id="bf-save">'+(isNew?"Salva estrazione":"Salva modifiche")+"</button></div></form>";
  const s = openSheet(isNew ? "Nuova estrazione" : "Modifica estrazione", inner);
  const $ = sel => s.el.querySelector(sel);

  function fieldsOf(m){ return METHODS[m] ? METHODS[m].fields : Object.keys(vals).filter(k => k !== "grinder" && k !== "grinderLabel" && k !== "machineLabel" && FIELDS[k]); }
  function readParams(){
    const p = {};
    for (const k of fieldsOf(method)){ if (vals[k] != null && vals[k] !== "") p[k] = vals[k]; }
    if (p.grind != null && vals.grinder){
      p.grinder = vals.grinder;
      p.grinderLabel = grinderLabel(S.grinders.get(vals.grinder)) || vals.grinderLabel || "";
    } else delete p.grind;
    if (p.machine) p.machineLabel = machineLabel(S.machines.get(p.machine)) || vals.machineLabel || "";
    return p;
  }
  function updateCalc(){
    const p = readParams(); const bits = [];
    const r = ratioText(method, p); if (r) bits.push("Rapporto <b class=\"num\">"+r+"</b>");
    if (r && /^espresso/.test(method) && p.yield != null) bits.push("Resa <b class=\"num\">"+fmtNum(p.yield)+" g</b>");
    const dr = methodRatio(method); if (r && dr && r !== "1:" + fmtNum(dr)) bits.push("predefinito 1:" + fmtNum(dr));
    if (p.bypass) bits.push("In infusione <b class=\"num\">"+fmtNum(p.water - p.bypass)+" g</b>");
    if (coffee.roastDate){ const a = daysBetween(coffee.roastDate, $("#bf-at").value); if (a != null && a >= 0) bits.push("<b class=\"num\">"+a+"</b> gg dalla tostatura"); }
    $("#bf-calc").innerHTML = bits.join(" · ");
  }
  function drawDefs(){
    $("#bf-defs").innerHTML = METHODS[method]
      ? '<button type="button" class="btn small" id="bf-setdef">Salva come predefiniti di '+esc(methodLabel(method))+"</button>"
      : "";
  }
  function drawPrefill(){
    const box = $("#bf-prefill");
    const last = isNew && METHODS[method] ? (brewsOf(coffee.id).find(x => x.method === method) || S.brews.find(x => x.method === method)) : null;
    box.innerHTML = last
      ? '<button type="button" class="btn small" id="bf-uselast">Usa i valori dell\'ultima '+esc(methodLabel(method))+'</button><span class="hint">'+(last.coffeeId === coffee.id ? "questo caffè" : "altro caffè")+", "+fmtDate(last.at)+"</span>"
      : "";
    const btn = $("#bf-uselast");
    if (btn) btn.onclick = () => { vals = {...methodDefaults(method), ...(last.params || {})}; if (last.params && last.params.grind != null && !last.params.grinder){ delete vals.grind; } bloomLinked = false; drawFields(); toast("Valori dell'ultima estrazione caricati"); };
  }
  function drawFields(){
    $("#bf-fields").innerHTML = fieldsOf(method).map(k => FIELDS[k] && FIELDS[k].type ? controlHtml(k, vals, method) : "").join("");
    updateCalc();
  }
  function setVal(k, v, fromInput){
    vals[k] = v;
    const out = $("#bf-" + k + "-out"); if (out) out.textContent = valueOut(k, v);
    if (!fromInput){ const r = $("#bf-" + k); if (r) r.value = v; }
    if (k === "dose" && bloomLinked && METHODS[method]?.bloomAuto && fieldsOf(method).includes("bloomWater")){
      setVal("bloomWater", Math.min(150, Math.round(v * METHODS[method].bloomAuto)));
    }
    if (k === "dose" && methodRatio(method)){
      const ok = fieldsOf(method).includes("yield") ? "yield" : "water", F = fieldDef(method, ok);
      if (fieldsOf(method).includes(ok)) setVal(ok, snap(v * methodRatio(method), F.min, F.max, F.step));
    }
    if (k === "bloomWater" && fromInput) bloomLinked = false;
    updateCalc();
  }
  drawPrefill(); drawFields(); drawDefs();

  const fieldsEl = $("#bf-fields");
  fieldsEl.addEventListener("input", e => {
    const r = e.target; if (r.type !== "range") return;
    const k = r.closest("[data-k]").dataset.k, f = fieldDef(method, k);
    if (f && f.slideStep){ const v = snap(Number(r.value), f.min, f.max, f.slideStep); if (v !== vals[k]) setVal(k, v); else r.value = v; return; }
    setVal(k, Number(r.value), true);
  });
  fieldsEl.addEventListener("click", e => {
    if (e.target.closest("[data-addmachine]")){
      machineSheet(null, m => { if (!m) return; vals.machine = m.id; drawFields(); });
      return;
    }
    if (e.target.closest("[data-addgrinder]")){
      grinderSheet(null, g => { if (!g) return; vals.grinder = g.id; vals.grind = defaultGrind(method, g.id); drawFields(); });
      return;
    }
    const st = e.target.closest(".step");
    if (st){
      const wrap = st.closest("[data-k]"), k = wrap.dataset.k, r = wrap.querySelector("input[type=range]");
      const min = Number(r.min), max = Number(r.max), step = Number(r.step);
      const nv = snap((vals[k] == null ? min : vals[k]) + Number(st.dataset.d) * step, min, max, step);
      if (k === "bloomWater") bloomLinked = false;
      setVal(k, nv); return;
    }
    const opt = e.target.closest(".seg [data-v]");
    if (opt){
      const seg = opt.closest(".seg"), k = seg.dataset.k;
      if (k === "grinder"){
        if (vals.grinder === opt.dataset.v) return;
        const from = {grinder: vals.grinder, value: vals.grind};
        vals.grinder = opt.dataset.v;
        vals.grind = defaultGrind(method, vals.grinder, from);
        drawFields(); return;
      }
      let v = seg.dataset.bool ? opt.dataset.v === "1" : opt.dataset.v;
      if (!seg.dataset.bool && vals[k] === v){ if (FIELDS[k] && FIELDS[k].required) return; v = null; }
      vals[k] = v;
      /* moka: cambiando le tazze, dose (e acqua col rapporto) partono dal valore indicativo */
      if (k === "cups" && METHODS[method] && METHODS[method].cupsDose && METHODS[method].cupsDose[v] != null) setVal("dose", METHODS[method].cupsDose[v]);
      seg.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-checked", String(seg.dataset.bool ? (x.dataset.v === "1") === v : x.dataset.v === v)));
      updateCalc();
    }
  });
  fieldsEl.addEventListener("change", e => {
    const c = e.target.closest("[data-check]"); if (!c) return;
    vals[c.dataset.check] = c.checked; updateCalc();
  });
  $("#bf-at").addEventListener("change", updateCalc);
  $("#bf-defs").addEventListener("click", async e => {
    if (!e.target.closest("#bf-setdef")) return;
    const p = readParams(); delete p.grinderLabel; delete p.machineLabel;
    try {
      await setMeta({methodDefaults: {...savedDefaults(), [method]: p}});
      updateCalc(); toast("Le prossime estrazioni " + methodLabel(method) + " partiranno da questi valori");
    } catch(err){ toast(errMsg(err)); }
  });
  $("#bf-methods").addEventListener("click", e => {
    const ch = e.target.closest("[data-m]"); if (!ch || ch.dataset.m === method) return;
    const prev = vals; method = ch.dataset.m;
    s.el.querySelectorAll("#bf-methods [data-m]").forEach(x => { const on = x.dataset.m === method; x.setAttribute("aria-pressed", on); x.setAttribute("aria-checked", on); });
    if (METHODS[method]){
      vals = methodDefaults(method);
      if (!isNew){ for (const k of fieldsOf(method)) if (prev[k] != null && k !== "grind") vals[k] = prev[k]; }
      bloomLinked = isNew;
    }
    drawPrefill(); drawFields(); drawDefs();
  });
  const paintRating = () => s.el.querySelectorAll("#bf-rating [data-r]").forEach(x => x.classList.toggle("on", Number(x.dataset.r) <= rating));
  paintRating();
  $("#bf-rating").addEventListener("click", e => { const r = e.target.closest("[data-r]"); if (!r) return; const n = Number(r.dataset.r); rating = rating === n ? 0 : n; paintRating(); });

  function drawAromas(){
    const list = sortAromas(aromas);
    $("#bf-aromas").innerHTML = list.map(a => aromaChip(a, true)).join("");
    $("#bf-aromas").hidden = !list.length;
    $("#bf-wheel").textContent = list.length ? "Modifica con la ruota" : "Scegli dalla ruota degli aromi";
  }
  drawAromas();
  $("#bf-wheel").addEventListener("click", () => aromaSheet(aromas, drawAromas));
  $("#bf-aromas").addEventListener("click", e => { const r = e.target.closest("[data-rm]"); if (r){ aromas.delete(r.dataset.rm); drawAromas(); } });
  const sh = $("#bf-share");
  if (sh) sh.addEventListener("click", () => shareBrew(b, sh));
  const del = $("#bf-del");
  if (del) del.addEventListener("click", async () => {
    if (!(await confirmBox("Eliminare questa estrazione?" + (b.public ? " Sparirà anche dalla Community." : ""), "Elimina"))) return;
    try { await retryOnce(() => db.collection("brews").doc(b.id).delete()); s.close(); toast("Estrazione eliminata"); }
    catch(e){ toast(errMsg(e)); }
  });

  $("#bf").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#bf-save"); btn.disabled = true; btn.textContent = "Salvo…";
    const atVal = $("#bf-at").value; const at = atVal ? new Date(atVal) : new Date();
    const data = {
      coffeeId: coffee.id, method, at: (isNaN(at) ? new Date() : at).toISOString(),
      params: readParams(), rating, notes: $("#bf-notes").value.trim(),
      ...(aromas.size ? {aromas: sortAromas(aromas)} : {}),
      createdAt: b?.createdAt || new Date().toISOString(),
      /* per la Community: gli altri non vedono la confezione, quindi scheda e giorni dalla tostatura si salvano qui */
      catalogId: coffee.catalogId, public: $("#bf-public").checked,
    };
    const age = coffee.roastDate ? daysBetween(coffee.roastDate, data.at) : null;
    data.roastDays = age != null && age >= 0 ? age : null;
    try {
      const id = b?.id || uid("b");
      await retryOnce(() => db.collection("brews").doc(id).set(data));
      s.close(); toast(data.public ? (isNew ? "Estrazione salvata e condivisa nella Community" : "Modifiche salvate e condivise nella Community") : (isNew ? "Estrazione salvata" : "Modifiche salvate"));
    } catch(err){ btn.disabled = false; btn.textContent = isNew?"Salva estrazione":"Salva modifiche"; toast(errMsg(err)); }
  });
}

/* disegno: vista a fuoco su una categoria, al massimo due anelli intorno al centro */
const LUM = hex => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
const inkOn = hex => LUM(hex) > .2 ? "#1f1b18" : "#ffffff";
let measureCtx = null;
function textW(t, size, weight){
  if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = (weight || 500) + " " + size + 'px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif';
  return measureCtx.measureText(t).width;
}
function splitTwo(t){
  const out = [];
  for (let i = 1; i < t.length - 1; i++){
    if (t[i-1] === "/" ) out.push([t.slice(0, i), t.slice(i)]);
    else if (t[i] === " ") out.push([t.slice(0, i), t.slice(i + 1)]);
  }
  return out;
}
/* sceglie dimensione, righe e orientamento (lungo l'arco o lungo il raggio) che entrano nello spicchio */
function fitLabel(t, a0, a1, r0, r1, maxSize, weight){
  const span = a1 - a0, rm = (r0 + r1) / 2, rad = r1 - r0 - 8;
  const chord = r => span >= Math.PI ? 2 * r : 2 * r * Math.sin(span / 2);
  const splits = splitTwo(t);
  for (let size = maxSize; size >= 8; size -= 0.5){
    const lh = size * 1.12;
    const tries = [[t]];
    if (splits.length){
      const best = splits.map(s => [s, Math.max(textW(s[0], size, weight), textW(s[1], size, weight))]).sort((a, b) => a[1] - b[1])[0][0];
      tries.push(best);
    }
    for (const lines of tries){
      const n = lines.length, w = Math.max(...lines.map(l => textW(l, size, weight)));
      const th = n * lh;
      /* lungo l'arco: il bordo interno del testo deve stare nella corda, gli angoli esterni nell'anello */
      if (th <= rad && w <= chord(rm - th / 2) - 6 && Math.hypot(rm + th / 2, w / 2) <= r1 - 3) return {size, lines, orient:"t", pos:rm};
      /* lungo il raggio: centrato se c'è spazio, altrimenti spostato verso l'esterno dove lo spicchio è più largo */
      if (w <= rad){
        const need = span >= Math.PI ? 0 : (th + 1) / (2 * Math.sin(span / 2));
        const rin = Math.max(rm - w / 2, need);
        if (rin + w <= r1 - 4) return {size, lines, orient:"r", pos: rin + w / 2};
      }
    }
  }
  return null;
}
function arcPath(a0, a1, r0, r1){
  const p = (r, a) => (r * Math.sin(a)).toFixed(2) + " " + (-r * Math.cos(a)).toFixed(2);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return "M" + p(r1, a0) + "A" + r1 + " " + r1 + " 0 " + large + " 1 " + p(r1, a1) +
    "L" + p(r0, a1) + "A" + r0 + " " + r0 + " 0 " + large + " 0 " + p(r0, a0) + "Z";
}
function labelSvg(fit, am, fill, bold){
  const deg = am * 180 / Math.PI;
  let rot = fit.orient === "r" ? deg - 90 : deg;
  if (fit.orient === "r" && am > Math.PI) rot += 180;
  if (fit.orient === "t" && am > Math.PI / 2 && am < 3 * Math.PI / 2) rot += 180;
  const x = fit.pos * Math.sin(am), y = -fit.pos * Math.cos(am), lh = fit.size * 1.12, n = fit.lines.length;
  return '<text transform="translate('+x.toFixed(2)+" "+y.toFixed(2)+") rotate("+rot.toFixed(2)+')" font-size="'+fit.size+'" fill="'+fill+'"'+(bold ? ' font-weight="700"' : "")+' text-anchor="middle">' +
    fit.lines.map((l, i) => '<tspan x="0" y="'+((i - (n - 1) / 2) * lh).toFixed(2)+'" dominant-baseline="central">'+esc(l)+"</tspan>").join("") + "</text>";
}
function wheelLayout(focus){
  if (!focus) return {c:42, rings:[[42, 118], [118, 198]]};
  if (focus.depth === 1) return {c:60, rings:[[60, 128], [128, 198]]};
  return {c:72, rings:[[72, 198]]};
}
function wheelSvg(st){

  const outer = L.rings[L.rings.length - 1][1];
  let segs = "", marks = "";
  const walk = (nodes, a0, a1, lvl) => {
    const total = nodes.reduce((s, n) => s + n.units, 0);
    let a = a0;
    for (const n of nodes){
      const b = a + (a1 - a0) * n.units / total, ring = L.rings[lvl];
      const r0 = ring[0], r1 = n.children.length ? ring[1] : outer; /* gli aromi senza figli arrivano al bordo */
      const on = marked(n.id), name = n[aromaLang];
      const fit = fitLabel(name, a, b, r0, r1, L.rings.length === 1 ? 16 : lvl === 0 && !F ? 13 : 12, on ? 700 : 500);
      segs += '<g data-id="'+esc(n.id)+'" role="button" tabindex="0" aria-label="'+esc(name + (n.children.length ? ", apri" : "") + (on ? ", selezionato" : ""))+'">' +
        '<path class="a" d="'+arcPath(a, b, r0, r1)+'" fill="'+n.color+'"/>' +
        (fit ? labelSvg(fit, (a + b) / 2, inkOn(n.color), on) : "") + "</g>";
      if (on){ const d = arcPath(a + 1.6 / r0, b - 1.6 / r0, r0 + 2.2, r1 - 2.2); marks += '<path class="sel-bg" d="'+d+'"/><path class="sel" d="'+d+'"/>'; }
      if (n.children.length){
        if (L.rings[lvl + 1]) walk(n.children, a, b, lvl + 1);
        else if (markedInside(n)){
