  });
  document.getElementById("lg-forgot").addEventListener("click", async () => {
    const email = document.getElementById("lg-email").value.trim();
    if (!email) return showErr("Scrivi la tua email qui sopra, poi premi di nuovo “Password dimenticata?”.");
    err.hidden = true;
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    if (error && /rate|limit/i.test(error.message)) return showErr("Troppe richieste: riprova tra qualche minuto.");
    if (error) return showErr("Invio non riuscito. Se il problema continua, chiedi all'amministratore di reimpostare la password.");
    S.loginMsg = "Se l'indirizzo è registrato riceverai un'email con il link per scegliere una nuova password."; renderLogin();
  });
}
function renderSetPassword(){
  app.innerHTML = '<header class="top"><div><h1>'+APP_TITLE+'</h1><p>Scegli la password che userai per accedere da tutti i dispositivi.</p></div></header>' +
    '<form class="login" id="setpw" novalidate>' +
    (session && session.user && session.user.email ? '<p class="small muted" style="margin:0">Account: '+esc(session.user.email)+"</p>" : "") +
    '<div class="field"><label for="pw1">Nuova password (almeno 8 caratteri)</label>'+passInput("pw1", "new-password")+'</div>' +
    '<div class="field"><label for="pw2">Ripeti la password</label>'+passInput("pw2", "new-password")+'</div>' +
    '<p class="err" id="pw-err" hidden></p>' +
    '<button class="btn primary" type="submit" id="pw-go" style="align-self:flex-start">Salva e continua</button></form>';
  document.getElementById("setpw").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("pw-err"), btn = document.getElementById("pw-go");
    const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    const fail = t => { err.hidden = false; err.textContent = t; };
    if (a.length < 8) return fail("La password deve avere almeno 8 caratteri.");
    if (a !== b) return fail("Le due password non coincidono.");
    btn.disabled = true; btn.textContent = "Salvo…"; err.hidden = true;
    const {error} = await sb.auth.updateUser({password: a});
    if (error){ btn.disabled = false; btn.textContent = "Salva e continua"; return fail(/weak|short|characters/i.test(error.message) ? "Password troppo debole: allungala o aggiungi numeri e simboli." : "Non riesco a salvare la password. Il link potrebbe essere scaduto: chiedi un nuovo invito."); }
    toast("Password salvata"); startData();
  });
}
async function logout(){
  if (!(await confirmBox("Uscire su questo dispositivo? I dati restano salvati online.", "Esci"))) return;
  try { await sb.auth.signOut(); } catch {}
  try { localStorage.removeItem(CACHE_KEY); } catch {}
  if (channel){ sb.removeChannel(channel); channel = null; }
  session = null; db = null;
  S.catalog = new Map(); S.bags = new Map(); S.brews = []; S.grinders = new Map(); S.profiles = new Map(); S.counts = new Map();
  S.isAdmin = false; S.loaded = false; S.needLogin = true;
  go(null);
}

/* ---------- backup: esporta / importa ---------- */
const BACKUP_EVERY_DAYS = 14;
const lastBackup = () => meta().lastBackup || null;
function backupNudgeHtml(count){
  if (!count || !session) return "";
  const lb = lastBackup();
  const days = lb ? daysBetween(lb, new Date()) : null;
  if (days != null && days < BACKUP_EVERY_DAYS) return "";
  const txt = lb ? "Ultimo backup " + (days === 1 ? "ieri" : days + " giorni fa") : "Non hai ancora fatto un backup";
  return '<div class="nudge" role="status"><span>' + txt + '. L\'archivio online non ha copie automatiche: salvane una sul telefono o nel cloud.</span><button class="btn" data-act="export">Esporta ora</button></div>';
}
async function recordBackup(){
  try { await setMeta({lastBackup: new Date().toISOString()}); } catch {}
  render();
}
function footerHtml(){
  return '<footer class="foot"><button class="btn" data-act="settings">Impostazioni</button><button class="btn" data-act="export">Esporta backup</button><button class="btn" data-act="import">Importa backup</button><button class="btn" data-act="logout">Esci</button>' +
    (session ? '<span class="who">Accesso come ' + esc(session.user.email || "") + (myName() ? " (" + esc(myName()) + ")" : "") + (lastBackup() ? " · ultimo backup " + fmtDate(lastBackup()) : "") + "</span>" : "") + "</footer>";
}
const blobToDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function withPhotoData(o){
  const r = {...o};
  if (o.photo){ try { const res = await fetch(photoUrl(o.photo)); if (res.ok) r.photoData = await blobToDataURL(await res.blob()); } catch {} }
  return r;
}
async function buildBackup(){
  const bags = [...S.bags.values()];
  const catalog = [];
  for (const id of new Set(bags.map(b => b.catalogId))){ const k = S.catalog.get(id); if (k) catalog.push(await withPhotoData(k)); }
  return JSON.stringify({app:"diario-caffe-community", version:1, exportedAt:new Date().toISOString(),
    catalog, coffees:bags, brews:S.brews, grinders:[...S.grinders.values()], methodDefaults: meta().methodDefaults || null});
}
const backupName = () => "diario-caffe-community-backup-" + new Date().toISOString().slice(0,10) + ".json";
async function withBusy(el, label, fn){ const old = el ? el.textContent : ""; if (el){ el.disabled = true; el.textContent = label; } try { return await fn(); } finally { if (el){ el.disabled = false; el.textContent = old; } } }
async function exportBackup(el){
  await withBusy(el, "Preparo il file…", async () => {
    try {
      const json = await buildBackup(), name = backupName();
      const file = new File([json], name, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})){
        try { await navigator.share({files: [file], title: name}); } catch(e){ if (e && e.name === "AbortError") return; throw e; }
        await recordBackup(); toast("Backup pronto");
      } else {
        const url = URL.createObjectURL(file), a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        await recordBackup(); toast("Backup scaricato");
      }
    } catch { toast("Esportazione non riuscita. Riprova."); }
  });
}
async function photoFromData(photoData){
  if (!photoData) return null;
  try { const blob = await (await fetch(photoData)).blob(); return (await retryOnce(() => assets.upload(blob, {type: blob.type || "image/jpeg"}))).id; }
  catch { return null; }
}
/* Importa un backup di questa app oppure della versione personale del Diario caffè
   (in quel caso ogni caffè diventa una scheda del catalogo + una confezione in dispensa). */
function importBackup(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast("Il file non è un backup valido."); return; }
    const community = data && data.app === "diario-caffe-community", legacy = data && data.app === "diario-caffe";
    if ((!community && !legacy) || !Array.isArray(data.coffees) || !Array.isArray(data.brews)){ toast("Il file non è un backup del Diario caffè."); return; }
    const msg = legacy
      ? "Importare " + data.coffees.length + " caffè e " + data.brews.length + " estrazioni dalla versione personale? I caffè che non sono già nel catalogo diventano nuove schede visibili ai membri; date, pesi, prezzi ed estrazioni restano privati."
      : "Importare " + data.coffees.length + " confezioni e " + data.brews.length + " estrazioni? Se un elemento è già presente viene sostituito dalla versione del file.";
    if (!(await confirmBox(msg, "Importa"))) return;
    toast("Importazione in corso…");
    try {
      const now = new Date().toISOString();
      const grinderRows = [], catalogRows = [], bagRows = [];
      const newCatalog = new Set();
      if (community && Array.isArray(data.grinders)){
        for (const g of data.grinders){ if (!g || !g.id) continue; const {id, ...rest} = g; grinderRows.push({id: String(id), data: rest, updated_at: now}); }
      }
      if (community){
        for (const k of data.catalog || []){
          if (!k || !k.id || S.catalog.has(k.id)) continue;
          const {id, photoData, createdBy, ...rest} = k;
          const photo = photoData ? await photoFromData(photoData) : (rest.photo || null);
          catalogRows.push({id: String(id), data: {...pick(rest, CATALOG_FIELDS), photo, createdAt: rest.createdAt || now}, updated_at: now});
          newCatalog.add(String(id));
        }
        for (const c of data.coffees){
          if (!c || !c.id || !c.catalogId || !(S.catalog.has(c.catalogId) || newCatalog.has(c.catalogId))) continue;
          const {id, ...rest} = c;
          bagRows.push({id: String(id), catalog_id: rest.catalogId, data: rest, updated_at: now});
        }
      } else {
        const byKey = new Map([...S.catalog.values()].map(k => [norm(k.name) + "|" + norm(k.roaster), k.id]));
        for (const c of data.coffees){
          if (!c || !c.id || !c.name) continue;
          const key = norm(c.name) + "|" + norm(c.roaster);
          let kid = byKey.get(key);
          if (!kid){
            kid = "k" + c.id;
            if (!S.catalog.has(kid)){
              const photo = await photoFromData(c.photoData);
              catalogRows.push({id: kid, data: {...pick(c, CATALOG_FIELDS), photo, createdAt: c.createdAt || now}, updated_at: now});
            }
            byKey.set(key, kid);
          }
          bagRows.push({id: String(c.id), catalog_id: kid, data: {catalogId: kid, ...pick(c, BAG_FIELDS), createdAt: c.createdAt || now}, updated_at: now});
        }
      }
      /* estrazioni: nella versione personale i macinini erano "pietro" e "g5" */
      const legacyGrinder = new Map();
      const ensureGrinder = key => {
        if (legacyGrinder.has(key)) return legacyGrinder.get(key);
        const t = GRINDER_TEMPLATES.find(x => x.key === key); if (!t) return null;
        const found = [...S.grinders.values()].find(g => norm(g.model) === norm(t.model));
        let g = found;
        if (!g){ const id = uid("g"); g = {id, brand:t.brand, model:t.model, burrs:t.burrs, min:t.min, max:t.max, step:t.step, createdAt: now}; const {id: _x, ...rest} = g; grinderRows.push({id, data: rest, updated_at: now}); }
        legacyGrinder.set(key, g); return g;
      };
      const okBags = new Set([...bagRows.map(r => r.id), ...S.bags.keys()]);
      const brewRows = [];
      for (const b of data.brews){
        if (!b || !b.id || !okBags.has(String(b.coffeeId))) continue;
        const {id, ...rest} = b;
        if (legacy && rest.params && rest.params.grind != null){
          const g = ensureGrinder(rest.params.grinder || "pietro");
          rest.params = {...rest.params};
          if (g){ rest.params.grinder = g.id; rest.params.grinderLabel = grinderLabel(g); }
        }
        brewRows.push({id: String(id), coffee_id: String(rest.coffeeId), data: rest, updated_at: now});
      }
      const put = async (table, rows) => { for (let i = 0; i < rows.length; i += 200){ const {error} = await sb.from(table).upsert(rows.slice(i, i + 200)); if (error) throw wrapErr(error); } };
      await put("grinders", grinderRows);
      await put("catalog", catalogRows);
      await put("coffees", bagRows);
      await put("brews", brewRows);
      if (community && data.methodDefaults && !meta().methodDefaults) await setMeta({methodDefaults: data.methodDefaults}).catch(() => {});
      await refresh();
      toast("Importati " + bagRows.length + " caffè (" + catalogRows.length + " nuove schede) e " + brewRows.length + " estrazioni");
    } catch(e){ toast(errMsg(e)); }
  });
  inp.click();
}

/* ---------- avvio ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && db) refresh(); });
window.addEventListener("online", () => { if (db) refresh(); });
window.addEventListener("offline", () => { if (db){ S.offline = true; render(); } });
/* link ricevuti per email: invito o reimpostazione della password */
const linkParams = new URLSearchParams(location.hash.slice(1));
const linkType = linkParams.get("type"), linkError = linkParams.get("error_description") || linkParams.get("error");
render();
(async () => {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase){
    S.error = "Configurazione mancante: inserisci l'indirizzo e la chiave di Supabase nel file config.js.";
    render(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  const {data} = await sb.auth.getSession();
  session = data && data.session;
  sb.auth.onAuthStateChange((evt, s) => { if (s) session = s; if (evt === "PASSWORD_RECOVERY"){ S.needPassword = true; render(); } });
  if (linkType || linkError) history.replaceState(null, "", location.pathname + location.search);
  if (!session){
    S.needLogin = true;
    if (linkError) S.loginMsg = "Il link non è più valido. Chiedi un nuovo invito, oppure usa “Password dimenticata?”.";
    render(); return;
  }
  if (linkType === "invite" || linkType === "recovery"){ S.needPassword = true; render(); return; }
  startData();
})();
})();
</script>
